[package]
name         = "arbor-feedback"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Shared user-feedback core for Arbor: window-agnostic job registry, notification + operation event contracts, with optional per-window routing (`target`)."

[dependencies]
arbor-core        = { path = "../core" }
arbor-process-ext = { path = "../arbor-process-ext" }

serde      = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"
