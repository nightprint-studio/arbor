[package]
name         = "arbor-ipc"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Transport-agnostic IPC for Arbor's Model D (1 FE + N BE): method+JSON request/response + a one-way push-event channel, over an in-process loopback or framed JSON on a child's stdio."

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
# The credential contract (`SessionProvider`) is async — resolving a session is
# I/O (keyring read + OAuth refresh), and backend call sites are async. The trait
# is object-safe via async-trait so providers hold `Arc<dyn SessionProvider>`.
async-trait = { workspace = true }

[dev-dependencies]
# Drive the async SessionProvider contract test without pulling a full runtime.
futures-executor = { workspace = true }
