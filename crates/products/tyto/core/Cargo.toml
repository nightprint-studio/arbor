[package]
name         = "tyto-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Tyto backend core — the canonical headless state (`TytoState`) the `tyto-be` screen-recorder process owns. Tauri-free by construction; the recorder domain handlers live in tyto-be and drive against this state."

[dependencies]
arbor-ipc  = { path = "../../../foundation/ipc" }
# Resolves tyto's own per-profile config dir (`tyto_config_path`) for the typed
# `TytoConfig` persistence — exactly as sitta-core uses `sitta_config_path`.
arbor-core = { path = "../../../foundation/core" }
serde      = { workspace = true }
serde_json = { workspace = true }
# The typed product config (`config.toml`) is round-tripped through `toml`.
toml       = "0.8"
