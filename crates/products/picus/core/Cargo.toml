[package]
name         = "picus-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Picus backend core — the canonical headless state (`PicusState`) the `picus-be` SQL-studio process owns. Tauri-free by construction; the database and script domain handlers live in picus-be and drive against this state."

[dependencies]
arbor-ipc  = { path = "../../../foundation/ipc" }
# Resolves picus's own per-profile config dir (`picus_config_path`) for the typed
# `PicusConfig` persistence — exactly as bennu-core uses `bennu_config_path`.
arbor-core = { path = "../../../foundation/core" }
# The database contract: `PicusState` owns the engine registry + the live-session
# pool, so the handlers in picus-be reach both through the state they already get.
# This is the API crate only — it carries no driver, so picus-core stays light.
picus-db-api = { path = "../db-provider/api" }
serde      = { workspace = true }
serde_json = { workspace = true }
# The typed product config (`config.toml`) is round-tripped through `toml`.
toml       = "0.8"
