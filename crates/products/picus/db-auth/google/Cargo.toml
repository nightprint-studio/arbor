[package]
name         = "picus-auth-google"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Google IAM database authentication for Picus — turns the machine's Application Default Credentials into the short-lived access token Cloud SQL accepts in place of a password."

[dependencies]
picus-db-api = { path = "../../db-provider/api" }
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
# The same outbound client the rest of the workspace uses (`arbor-auth` refreshes OAuth tokens
# with it). Already a workspace pin — not a new dependency.
reqwest      = { workspace = true }
# A service-account key file authenticates by signing a JWT with its RSA private key (RS256), so
# the signature is the one thing the other credential kinds do not need. Pure Rust, no OpenSSL;
# `sha2` and `base64` are workspace pins already.
rsa          = { version = "0.9", features = ["sha2"] }
sha2         = { workspace = true }
base64       = { workspace = true }
