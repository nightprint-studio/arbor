[package]
name         = "corvus-git-cli"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Tauri-free system-`git` detection + PortableGit download for Corvus: the resolved-git Command builder and detection state, shared by the shell and the headless corvus-be process. The keyring-coupled HTTP auth-arg injection stays shell-side."

[dependencies]
arbor-core        = { path = "../../../foundation/core" }
# `NoWindowExt` — the console-suppression the resolved-git `Command` applies on
# Windows (same trait corvus-git uses).
arbor-process-ext = { path = "../../../platform/process-ext" }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
# `download_portable` is async (network) and offloads the CPU/IO-heavy extraction
# onto the blocking pool; the caller (shell or corvus-be) provides the runtime.
tokio      = { workspace = true }
reqwest    = { workspace = true }
# Pure-Rust 7z reader — extracts the PortableGit self-extracting archive without
# spawning its bundled GUI installer. Same pin the shell used pre-extraction.
sevenz-rust2 = "0.17"
