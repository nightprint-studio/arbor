[package]
name         = "corvus-issue-tracker-api"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Provider-agnostic issue-tracker contract for Corvus: DTOs (Issue, comments, filters, …), the async `IssueTracker` trait + self-describing `ProviderDescriptor`, and a trait-object registry. The leaf the Jira/Linear/GitHub/GitLab impls build on."

[dependencies]
serde       = { workspace = true }
# The `IssueTracker` trait is async (network I/O) and object-safe (held as
# `Arc<dyn IssueTracker>` in the registry) — async-trait provides both.
async-trait = { workspace = true }
# The self-describing `ProviderDescriptor` the trait returns is the shared,
# domain-agnostic contract (one type the git-host side + the generic FE speak).
corvus-provider-descriptor = { path = "../../provider-descriptor" }

[dev-dependencies]
# Asserts the descriptor's on-the-wire shape (the FE contract).
serde_json = { workspace = true }
