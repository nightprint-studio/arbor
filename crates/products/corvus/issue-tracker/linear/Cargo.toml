[package]
name         = "corvus-issue-tracker-linear"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Linear implementation of the Corvus `IssueTracker` trait — keyring-free (credentials via an injected `arbor_ipc::SessionProvider`)."

[dependencies]
corvus-issue-tracker-api = { path = "../api" }
# Credentials arrive injected as `Arc<dyn SessionProvider>` — no keyring here.
arbor-ipc   = { path = "../../../../foundation/ipc" }
# Shared reqwest client (timeout / user-agent).
arbor-core  = { path = "../../../../foundation/core" }
async-trait = { workspace = true }
serde_json  = { workspace = true }
reqwest     = { workspace = true }
