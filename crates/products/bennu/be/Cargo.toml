[package]
name         = "bennu-be"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Bennu backend — the headless Java-editor / analysis process for Model D. Serves the bennu domains (open_project/project_tree/read_file/capabilities/completion/diagnostics) over framed-stdio IPC; drives the leaf analysis crates, has no plugin host, no credentials, and resolves its own config/data dirs once init_active_profile() has run."

[[bin]]
name = "bennu-be"
path = "src/main.rs"

[dependencies]
arbor-ipc  = { path = "../../../foundation/ipc" }
arbor-rpc  = { path = "../../../foundation/rpc" }
# The Model-D backend runtime scaffold: `BackendIo` (framed-stdio plumbing +
# runtime) + the `App` builder (pre-serve inits, serve loop). bennu-be uses the slim
# path — no plugin host, no API installer, no scheduler (like merula-be).
arbor-be   = { path = "../../../foundation/be" }
# The profile-aware config/data-path resolver: `init_active_profile()` seeds the
# active profile FIRST in `main`, so the `bennu_*` config/data dirs resolve under the
# launcher's profile.
arbor-core = { path = "../../../foundation/core" }
# The canonical bennu state: `BennuState` (event egress + reverse channel) + the typed
# product config. The domain `#[arbor_rpc::handler]`s stay here in bennu-be and drive
# against `bennu_core::prelude::*`. Tauri-free by construction.
bennu-core = { path = "../core" }
# The Phase-0 IPC contract types the handlers return.
bennu-proto = { path = "../proto" }
# The leaf project model: capability detection, pom parse, encoding/JDK detection, the
# file tree, open_project / read_file orchestration.
bennu-project = { path = "../project" }
# The code-intel seam: completion + the config-graph resolver (C1 chain + view chain +
# conservative action diagnostic) the native provider ingests and serves.
bennu-intel = { path = "../intel" }
# The mmap'd symbol index: the `IndexBuilder` the index service holds on each project slot
# so a single-file edit patches just the changed file's records in — no whole-project walk.
bennu-index = { path = "../index" }
# The structural symbol extractor (`extract_symbols`) — the fresh-scan class index
# (`bennu_class_index`) parses each `.java` source into its declared types directly.
bennu-java = { path = "../java" }
# The web-config graph: the be layer discovers the project's struts/spring/tiles files
# (`WebInputs`) and drives `build_web_graph`; `bennu-intel` ingests the result.
bennu-web = { path = "../web" }
# The classpath resolver: `find_jdk_home` (JAVA_HOME for the build/run shell-out) + the
# Phase-2 `.m2` Maven classpath resolver (dep jars for the run classpath).
bennu-classpath = { path = "../classpath" }
# `NoWindowExt` — suppress the console window on the short-lived mvn/javac/java children.
arbor-process-ext = { path = "../../../platform/process-ext" }
serde      = { workspace = true }
serde_json = { workspace = true }
# Per-repo run-config persistence: read/merge/write `<repo>/.arbor/config.toml`'s
# `[bennu.run]` section (same version bennu-core already pins). Not a new external dep —
# it's already used across the workspace (bennu-core, corvus repo_config).
toml       = "0.8"
# Drives the serve loop / async domain handlers as the index / analysis waves land.
tokio      = { workspace = true }
# HTTP client for `bennu_download_dictionaries` (LibreOffice Hunspell `.aff`/`.dic`). Uses
# the shared `arbor_core::prelude::client()` defaults; the workspace `reqwest` is here only
# for the `reqwest::Client` type in the download helper signature. No new external crate.
reqwest    = { workspace = true }
