[package]
name         = "bennu-be"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Bennu backend — the headless Java-editor / analysis process for Model D. Serves the bennu domains (open_project/project_tree/read_file/capabilities/completion/diagnostics) over framed-stdio IPC; drives the leaf analysis crates, has no plugin host, no credentials, and resolves its own config/data dirs once init_active_profile() has run."

[[bin]]
name = "bennu-be"
path = "src/main.rs"

[dependencies]
arbor-ipc  = { path = "../../../foundation/ipc" }
arbor-rpc  = { path = "../../../foundation/rpc" }
# The Model-D backend runtime scaffold: `BackendIo` (framed-stdio plumbing +
# runtime) + the `App` builder (pre-serve inits, serve loop). bennu-be uses the slim
# path — no plugin host, no API installer, no scheduler (like merula-be).
arbor-be   = { path = "../../../foundation/be" }
# The host-pure plugin surface: bennu hosts plugins, so it needs the host and the `arbor.*`
# namespaces that do not belong to any one product.
arbor-plugin-core = { path = "../../../platform/plugin/core" }
# The Plugin Manager's RPC surface, generic over a context — see `plugin_rpc.rs`.
arbor-plugin-rpc  = { path = "../../../platform/plugin/rpc" }
# The platform's Lua namespaces (`arbor.job`): product-agnostic by construction — every op
# forwards to the shell over the reverse channel — so they are a platform crate this backend
# installs rather than namespaces of its own.
arbor-plugin-ns   = { path = "../../../platform/plugin/ns" }
# The profile-aware config/data-path resolver: `init_active_profile()` seeds the
# active profile FIRST in `main`, so the `bennu_*` config/data dirs resolve under the
# launcher's profile.
arbor-core = { path = "../../../foundation/core" }
# The canonical bennu state: `BennuState` (event egress + reverse channel) + the typed
# product config. The domain `#[arbor_rpc::handler]`s stay here in bennu-be and drive
# against `bennu_core::prelude::*`. Tauri-free by construction.
bennu-core = { path = "../core" }
# The Phase-0 IPC contract types the handlers return.
bennu-proto = { path = "../proto" }
# The leaf project model: capability detection, pom parse, encoding/JDK detection, the
# file tree, open_project / read_file orchestration.
bennu-project = { path = "../project" }
# Local history: the content store behind "what did this file used to be". A foundation
# crate on purpose — it speaks paths and bytes, so Garrulus and Picus can take the same
# one. Which files are worth recording is decided HERE, not there: only Bennu knows what
# git ignores in this project.
arbor-history = { path = "../../../foundation/history" }
# The code-intel seam: completion + the config-graph resolver (C1 chain + view chain +
# conservative action diagnostic) the native provider ingests and serves.
bennu-intel = { path = "../intel" }
# The code-intel query engine: the resolver + completion + inherited-members domain types the
# index service maps to the wire (`InheritedMember`).
bennu-query = { path = "../query" }
# The other half of the code-intel seam: a generic LSP client. Java goes to the native engine
# above, every other language goes to a language server through this. Serde-only itself — no new
# external dependency comes in with it.
bennu-lsp = { path = "../lsp" }
# AST-level Java validation (syntax errors + unused imports) over the live buffer — no compile.
bennu-check = { path = "../check" }
# Naming conventions as an opt-in feature pack. A leaf: the `[naming]` section decoded, a buffer
# scanned, and one violation per declaration whose name breaks it — each carrying the name that
# would. `crate::naming` is the glue that gives it a project.
bennu-naming = { path = "../naming" }
# The mmap'd symbol index: the `IndexBuilder` the index service holds on each project slot
# so a single-file edit patches just the changed file's records in — no whole-project walk.
bennu-index = { path = "../index" }
# The structural symbol extractor (`extract_symbols`) — the fresh-scan class index
# (`bennu_class_index`) parses each `.java` source into its declared types directly. Also the
# Java `Language` itself (`java_language`), which the syntax-tree panel walks: the grammar's
# version is a workspace-wide fact (`tree-sitter` is a `links` native lib), so it is pinned
# there and asked for here rather than depended on twice.
bennu-java = { path = "../java" }
# The language-agnostic tree walk behind the syntax-tree panel (`ast.rs`). The same crate
# Picus's panel uses — one shape across the seam, one component drawing both.
arbor-syntax = { path = "../../../foundation/syntax" }
# The structural search & replace language: parsing a query, matching it, grouping the hits,
# rendering a replacement. Knows no Java and no filesystem — `ssr.rs` supplies the grammar, the
# walk and a `TypeOracle` over the resolver.
bennu-ssr = { path = "../ssr" }
# Only to name `Language` in the grammar registry's signature — the grammar itself comes from
# `bennu-java`. Pinned to the workspace's single `links = "tree-sitter"` version.
tree-sitter = "0.25"
# The Alt+Enter intention transforms (pure Java source rewrites: parameterize logging,
# NP-safe equals) — thin `#[handler]` wrappers drive these.
bennu-intentions = { path = "../intentions" }
# The web-config graph: the be layer discovers the project's struts/spring/tiles files
# (`WebInputs`) and drives `build_web_graph`; `bennu-intel` ingests the result.
bennu-web = { path = "../web" }
# The classpath resolver: `find_jdk_home` (JAVA_HOME for the build/run shell-out) + the
# Phase-2 `.m2` Maven classpath resolver (dep jars for the run classpath).
bennu-classpath = { path = "../classpath" }
# The framework-extension seam: the `FrameworkExtension` trait + the capability-gated
# registry the `spring` domain dispatches through. Framework-agnostic — the be layer holds
# a registry, not a Spring model.
bennu-ext = { path = "../ext" }
# The first extension: Spring (beans / injection points / endpoints / application*.yml +
# the editor answers over them). Registered by name in ONE place (`spring::SpringService`);
# a second framework is one more entry in that vector.
bennu-spring = { path = "../spring" }
# The second extension: JPA / Spring Data (entities, repositories, `@Query`, and the derived
# query names Spring Data compiles at startup) + its generators. Registered beside Spring in the
# same vector — which is the whole claim the extension seam was built on.
bennu-jpa = { path = "../jpa" }
# The third extension: XML schemas (DTD + XSD → completion, ghost text, hover, go-to, checks).
# Unlike the other two it is not capability-gated — the resolved grammar is its gate, and a
# document nothing describes costs one scan and one map lookup.
bennu-xml = { path = "../xml" }
# The fourth extension: JSP tag libraries (the TLDs a page declares → tag/attribute completion,
# checks, hover and go-to). Gated on the project having any, and fed by the `.tld`s this crate
# collects — from the tree and from inside the dependency jars.
bennu-jsp = { path = "../jsp" }
# The fifth extension: message bundles (the `.properties` half of every screen a legacy web app
# renders) → go-to, hover in every language, the keys nothing declares and the keys nothing uses.
bennu-i18n = { path = "../i18n" }
# The fulcrum engine's i18n convention — the fifth framework extension, and the first that applies
# to a Cargo root rather than a Maven one.
bennu-fulcrum-i18n = { path = "../fulcrum/i18n" }
# Bevy ECS — the components, resources and events a Rust project declares, the systems that touch
# them, and the pairs an access conflict serialises. Gated on a `bevy` dependency in the Cargo
# manifest, so a Maven project never carries it.
bennu-bevy = { path = "../bevy" }
# The JSP grammar itself — the SAME generate the editor loads as wasm. Named here for the two
# features that compare or display a real parse rather than a tolerant scan: the syntax-tree
# panel (`ast.rs`) and structural search (`ssr.rs`).
bennu-jsp-grammar = { path = "../jsp-grammar" }
# The unit-test half: what in the sources IS a test, the `mvn` arguments for a chosen scope,
# and the Surefire XML read back into per-case results. Pure — the spawn, the streaming and
# the report watch are this crate's `tests` domain.
bennu-test = { path = "../test" }
# The debugger's transport: a JDWP client (handshake, framing, negotiated id widths, the
# breakpoint/step/exception command set, the event stream). Zero external dependencies of its
# own — this crate's `debug` module is what makes it a debugger, by deciding what a session is
# and turning the VM's locations back into this project's files.
bennu-jdwp = { path = "../jdwp" }
# The DAP client — the debugger's transport for a native binary, as `bennu-jdwp` is for a JVM.
bennu-dap = { path = "../dap" }
# What the project depends on, read out of its poms and matched against the classpath the
# index service already resolved. Not an extension — it answers about the build, not about a
# buffer — so it hangs off its own domain rather than the registry.
bennu-deps = { path = "../deps" }
# The local Maven repository as a source of answers: where it is, what is in it, what the project
# resolves to against it without running Maven — the dependency tier's fallback and its diagnosis —
# and the pom.xml editor answers that follow from the same reading.
bennu-maven = { path = "../maven" }
# The refactorings that are pure source transforms — extract method / variable / constant, inline
# variable / method. Its own crate for the reason `bennu-intentions` is: there is no test runner in
# front of the editor, so a transform that cannot be unit-tested cannot be trusted.
bennu-refactor = { path = "../refactor" }
# The Cargo side: the manifest schema behind Cargo.toml validation + completion, the crate
# graph the Rust tool window shows, and the cargo command catalogue.
# The Project tree's filesystem watcher. Already in the workspace (garrulus-be and the shell
# use it); a project changes under the editor constantly — a checkout, an install, another
# editor — and until this arrived none of it was visible until the project was reopened.
notify = "6"
bennu-cargo = { path = "../cargo" }
# `package.json` with spans, the npm registry's URL and cache shape, and the range test that
# decides whether an "update available" is honest. Opens no sockets — this crate is the half
# that does.
bennu-npm   = { path = "../npm" }
# WGSL: naga-backed validation and a tolerant scanner, for a shader with no language
# server installed. Leaf crate — no Tauri, no IPC.
bennu-plugin      = { path = "../plugin" }
bennu-wgsl = { path = "../wgsl" }

# The rendered shader preview crosses the MCP seam as base64 PNG — the same shape and the same
# workspace dependency tyto-be uses for its screenshots.
base64 = { workspace = true }
# `NoWindowExt` — suppress the console window on the short-lived mvn/javac/java children.
arbor-process-ext = { path = "../../../platform/process-ext" }
# The log interpreter behind the Run/Build consoles: a line of a child's output → its level
# and its annotated pieces (ANSI, levels, timestamps, threads, URLs, paths, exceptions, stack
# frames). Language-agnostic by construction — resolving a frame's class to a project file is
# this crate's `log` module, over the index.
arbor-logscan = { path = "../../../foundation/logscan" }
# Shared job model (`JobSpec` / `JobStatus`): the whole-project analysis warm-up registers itself
# as a tracked job in the shell registry over the reverse channel, so it shows in the bennu Jobs
# overlay. Workspace-internal crate (same one corvus/merula use), not a new external dependency.
arbor-feedback = { path = "../../../platform/feedback" }
serde      = { workspace = true }
serde_json = { workspace = true }
# JSON Schema for the `#[handler(mcp(...))]` args structs — the field `///`s become the
# per-parameter descriptions an AI client reads. Direct because `#[derive(JsonSchema)]`
# needs the crate name in scope; version from the workspace pin.
schemars   = { workspace = true }
# Per-repo run-config persistence: read/merge/write `<repo>/.arbor/config.toml`'s
# `[bennu.run]` section (same version bennu-core already pins). Not a new external dep —
# it's already used across the workspace (bennu-core, corvus repo_config).
toml       = "0.8"
# Drives the serve loop / async domain handlers as the index / analysis waves land.
tokio      = { workspace = true }
# HTTP client for `bennu_download_dictionaries` (LibreOffice Hunspell `.aff`/`.dic`). Uses
# the shared `arbor_core::prelude::client()` defaults; the workspace `reqwest` is here only
# for the `reqwest::Client` type in the download helper signature. No new external crate.
reqwest    = { workspace = true }
