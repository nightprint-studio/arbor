[package]
name         = "bennu-jakartaee"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Jakarta EE / Java EE as an editor understands it: the CDI and EJB beans a project declares, which of them satisfies each injection point, the servlets and filters it deploys and their URL patterns — and the handful of mistakes a container refuses at deployment, reported only when the source is enough to be sure."

[dependencies]
# The extension seam this crate implements.
bennu-ext      = { path = "../ext" }
# The wire types a contribution is made of (Diagnostic / CompletionItem / CapabilitySet).
bennu-proto    = { path = "../../runtime/proto" }
# The annotation-shaped scan and the origin rule: `@Singleton` is two different annotations in
# `javax.inject` and `javax.ejb`, and `@Produces` is JAX-RS as often as it is CDI.
bennu-facts    = { path = "../../analysis/facts" }
# The Java parse and the modifier-as-token reading — `final` and `private` are what proxyability is
# decided on, and the facts do not carry them.
bennu-java     = { path = "../../analysis/java" }
# The completion mechanics — prefix rule and the capped candidate list.
bennu-complete = { path = "../../editing/complete" }
# The tree-sitter runtime, pinned to the workspace-shared 0.25 (one `links` native library).
tree-sitter    = "0.25"
