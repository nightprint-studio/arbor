[package]
name         = "bennu-project"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Bennu project model — LEAF crate (docs §10). Owns capability-detection (Spike D ruleset: pom dep coords + config-file presence + source patterns → Capabilities), Maven pom parsing, module list, encoding detection, per-project JDK detection, and the project file tree. The analyzers depend on THIS crate, never the reverse."

[dependencies]
# The shared contract types the detection produces (CapabilitySet / ProjectInfo /
# JdkInfo / TreeNode / FileContents). bennu-project is the crate that fills them.
bennu-proto = { path = "../proto" }
serde      = { workspace = true }
serde_json = { workspace = true }
# Encoding decode for reading legacy sources (Cp1252 / ISO-8859-1 / …) — the WHATWG
# encoding set, so the project's declared `sourceEncoding` is honoured and a mislabelled
# file is detected (replacement chars) rather than silently corrupted. Already in the
# workspace tree (foundation/fs, corvus/git). Decode only; the round-trip save `encode`
# stays hand-rolled (its unmappable-char fallback semantics differ from encoding_rs').
encoding_rs = "0.8"
# Gitignore semantics for the file tree's "ignored" flag: nested `.gitignore` stacks,
# negations, `.git/info/exclude` and the user's global excludes. Matching only — the
# tree still walks and returns ignored entries, it just marks them.
ignore = { workspace = true }
