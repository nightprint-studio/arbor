[package]
name         = "bennu-intel"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Bennu code-intel seam (skeleton) — the `IntelProvider` trait (completion/hover/definition/references/diagnostics/rename/format/symbols) with a native-Java impl [MVP] and a PREDISPOSED LSP-client slot (rust-analyzer, no MVP impl). The FE speaks one protocol for every language."

[dependencies]
# The shared wire types the provider produces (completion / diagnostics). The seam
# returns proto types so the be layer forwards them unchanged.
bennu-proto = { path = "../proto" }
# ★ the product: the mmap'd symbol index the native provider builds + serves from.
bennu-index = { path = "../index" }
# The Java source model: parse + symbol extraction + local type-inference. The
# native provider builds index records from `extract_symbols` and infers the receiver
# type at a caret with `infer_receiver_type`.
bennu-java = { path = "../java" }
# The classpath member index (JDK bytecode): still used directly by the reference walk /
# provider for JDK-type lookups outside the resolver.
bennu-classpath = { path = "../classpath" }
# The code-intel query engine (extracted): `IndexResolver` + member-access `completion`. intel's
# provider / rename / hover / find-usages all resolve against it (one-way dependency).
bennu-query = { path = "../query" }
# AST + resolver-backed validation (syntax/statements/declarations/unknown-members): the provider's
# `validate` runs it against its own resolver.
bennu-check = { path = "../check" }
# Naming conventions (opt-in feature pack). Used here only for the identifier tokenizer, which
# `spell` re-exports rather than keeping a second copy of the same word split — the pack's own
# scan is merged into the diagnostics funnel one layer up, in `bennu-be`.
bennu-naming = { path = "../naming" }
# The web-config graph (Struts/Spring/Tiles): the native provider ingests its
# string-keyed records into the index (as `Source::StrutsAction`/`SpringBean` symbols +
# edges) and resolves the C1 chain (action → bean-id → FQCN) + the view chain off it.
bennu-web = { path = "../web" }
# The project model (LEAF): its `encoding::decode_for_index` decodes each source in the
# project's declared (Maven `sourceEncoding`) encoding, recovering + flagging a file whose
# bytes don't fit rather than dropping it. Depending on the leaf is the intended direction
# (analyzers depend on bennu-project, never the reverse).
bennu-project = { path = "../project" }
serde      = { workspace = true }
serde_json = { workspace = true }
# Java grammar for the reference walk + the rename CST parse (find-usages / rename key off
# the CST directly). Native tree-sitter, pinned to 0.25 like `bennu-java` (one shared
# `links = "tree-sitter"` runtime across the workspace).
tree-sitter      = "0.25"
tree-sitter-java = "0.23"
# Pure-Rust Hunspell (helix-editor/spellbook) — the spell-check engine loads en_US / it_IT
# `.aff`/`.dic` and checks declaration-name / comment sub-words. Memory-light, no C deps.
spellbook        = "0.4"

[dev-dependencies]
# The refactoring transforms, for the `refactor_case` measurement harness ONLY. A dev-dependency
# because nothing in the library uses them: the harness lives here for the resolver, which is what
# makes it measure the product rather than a resolver-free approximation of it.
bennu-refactor = { path = "../refactor" }
# The import inserter, so the harness adds the same edit the backend does.
bennu-intentions = { path = "../intentions" }
