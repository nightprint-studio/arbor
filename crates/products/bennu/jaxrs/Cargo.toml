[package]
name         = "bennu-jaxrs"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "JAX-RS resources as an editor understands them: every route a project's @Path classes answer, with the application path in front of it, in the shared Endpoints panel beside Spring and Struts — and the mistakes the runtime only reports when a request arrives, or when the deployment is refused."

[dependencies]
# The extension seam this crate implements.
bennu-ext      = { path = "../ext" }
# The wire types a contribution is made of (Diagnostic / CompletionItem / CapabilitySet).
bennu-proto    = { path = "../proto" }
# The annotation-shaped Java scan, and the rule that tells `javax.ws.rs.Produces` from CDI's
# `@Produces` — which is the difference between a media type and a producer method.
bennu-facts    = { path = "../facts" }
# The capped, de-duplicated candidate list a completion provider hands back.
bennu-complete = { path = "../complete" }
