[package]
name         = "bennu-toolconf"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "The build-tool configuration files of a JVM project that have a documented, versioned vocabulary behind them — lombok.config and junit-platform.properties. One properties reader and one catalogue driver, two key tables, and the project's own resolved version deciding which half of each table exists."

[dependencies]
# The extension seam this crate implements.
bennu-ext      = { path = "../ext" }
# The wire types a contribution is made of (Diagnostic / CompletionItem / CapabilitySet).
bennu-proto    = { path = "../proto" }
# Where the caret is, and the candidate collector every other provider offers through.
bennu-complete = { path = "../complete" }
# What the project's poms resolve to, `${…}` and <dependencyManagement> folded in — the only
# honest answer to "which Lombok is this project actually on".
bennu-maven    = { path = "../maven" }
