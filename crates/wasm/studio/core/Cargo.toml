[package]
name         = "arbor-studio-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Studio core — the StudioFormatBackend trait plus (incrementally, from Stage 2) the format-agnostic engines shared by every per-format backend: history, diff, query, edit-expr, refactor, persist. Depends only on arbor-studio-types. Tauri-free; WASM-guest compile target for Studio-as-plugin."

[dependencies]
arbor-studio-types = { path = "../types" }
serde_json   = { workspace = true }
async-trait  = { workspace = true }
# Line-level unified diff (core::diff). Mirrors the launcher's pin.
similar = { workspace = true }
# JSONPath query engine (core::query).
serde_json_path = "0.7"
# Encoding-aware read/write flush (core::persist) — preserves each file's
# original encoding label + BOM across a multi-file F12/F13 refactor.
arbor-fs      = { path = "../../../foundation/fs" }
# Doc-id generation for DefaultBackend's registry (core::default_backend).
uuid         = { workspace = true }
