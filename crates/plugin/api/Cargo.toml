[package]
name         = "arbor-plugin-api"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Hook dispatcher (name-agnostic) and listener registry. Domain crates declare hook name constants in their own crate and call `fire_hook(name, ctx)` here; the plugin runtime registers Lua listeners against it."

[dependencies]
arbor-core         = { path = "../../core" }
arbor-plugin-types = { path = "../types" }

serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }
