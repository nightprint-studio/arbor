[package]
name         = "arbor-plugin-types"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Pure data shapes shared by the plugin runtime and the marketplace: manifest, permissions, dependencies, schedule, hook catalog (names only), PluginConfig."

[dependencies]
# Pure data shapes only — no `arbor-core` dep yet. None of the migrated types
# need `AppError` or paths/HTTP helpers; the host crate owns I/O + error
# mapping. Re-add `arbor-core` when (and only when) the first type here
# actually references it (e.g. once `PluginConfig` is introduced and wants the
# `AppCtx` trait).
serde      = { workspace = true }
thiserror  = { workspace = true }

# Manifest-file format (`plugin.toml`).
toml   = "0.8"
