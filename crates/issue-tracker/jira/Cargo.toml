[package]
name         = "arbor-issue-tracker-jira"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Atlassian Jira implementation of IssueTracker (Cloud + Data Center / Server). Tolerates self-signed certificates common in on-prem installations."

[dependencies]
arbor-core              = { path = "../../core" }
arbor-auth              = { path = "../../arbor-auth" }
arbor-issue-tracker-api = { path = "../api" }

serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
reqwest     = { workspace = true }
keyring     = { workspace = true }

# Jira renderedFields ship server-side HTML in descriptions/comments — sanitize
# before passing to the frontend renderer.
ammonia = "4"
chrono  = { version = "0.4", features = ["serde"] }
