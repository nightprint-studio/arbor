[package]
name         = "arbor-pipeline-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Pipeline orchestrator: run state machine, stage/step scheduling, persistence of run history, event emission. Consumes step extensions registered through arbor-pipeline-api (built-in + plugin-provided)."

[dependencies]
arbor-core         = { path = "../../core" }
arbor-scheduler    = { path = "../../scheduler" }
arbor-plugin-api   = { path = "../../plugin/api" }
arbor-pipeline-api = { path = "../api" }

serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
dirs        = { workspace = true }
uuid        = { workspace = true }

chrono = { version = "0.4", features = ["serde"] }
