[package]
name         = "merula-lang"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "merula — the .merula language: text ↔ Pattern. Tree-sitter front end → typed AST → evaluator (text → Pattern) + emitter (AST → source) + span-aware error reporting."

# `merula-pattern` is the pure algebra (Fase 0). The Tree-sitter front end
# adds `tree-sitter` (the runtime that drives the generated `parser.c` +
# `scanner.c`) and the `cc` build-dependency (compiles that C in `build.rs`).
# These are the only two external crates; the generated `src/parser.c` is
# committed so a plain `cargo build` needs no Node / Tree-sitter CLI.
[dependencies]
merula-pattern = { path = "../merula-pattern" }
tree-sitter = "0.25"

[build-dependencies]
cc = "1"

[lints.rust]
missing_debug_implementations = "warn"
