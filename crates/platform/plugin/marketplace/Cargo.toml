[package]
name         = "arbor-plugin-marketplace"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Curated and custom plugin/theme catalog, installer (ZIP extraction + manifest validation), and refresh scheduler. Resolves entries from the curated `arbor-extensions` GitHub repo and user-supplied sources."

[dependencies]
arbor-core         = { path = "../../../foundation/core" }
arbor-plugin-types = { path = "../types" }

serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
tokio        = { workspace = true }
futures-util = { workspace = true }
reqwest      = { workspace = true }

# Manifest-file format and dependency version constraints. The marketplace
# parses third-party plugin.toml during catalog resolution and compares
# semver against the host before installing.
toml   = "0.8"
semver = "1"

# ZIP extraction for downloaded entries.
zip = "2"

# Content verification for release artifacts. A `.wasm` is a build output, so a commit pin
# says nothing about it — the registry entry records its digest and this checks it. Same
# workspace pin every other hashing site uses.
sha2 = { workspace = true }
