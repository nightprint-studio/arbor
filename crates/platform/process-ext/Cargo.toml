[package]
name         = "arbor-process-ext"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "The platform's process oddities: suppressing Windows' console-window popup, and finding a tool's executable when a windowed app's PATH is not the shell's."

[dependencies]
# `user_home()` — the executable search has to look where tools actually are (`~/.cargo/bin`, a VS
# Code extension dir, `~/.local/bin`), and a windowed app's PATH holds almost none of them.
arbor-core = { path = "../../foundation/core" }
