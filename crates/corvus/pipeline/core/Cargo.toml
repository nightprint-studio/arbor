[package]
name         = "corvus-pipeline-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Host-free run-tracking core for Corvus pipelines: the in-memory run registry (concurrency locks + cancel tokens), JSON run persistence, and the pure orchestration helpers (resume-cursor computation, step-tree lookup, output chunking, log-level inference). The live orchestrator (threads, process spawn, event emission) stays host-side."

[dependencies]
corvus-pipeline-api = { path = "../api" }
# Persistence resolves the run-store dir via arbor-core's path helpers.
arbor-core = { path = "../../../core" }
serde_json = { workspace = true }
tracing    = { workspace = true }
