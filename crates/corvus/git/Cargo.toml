[package]
name         = "corvus-git"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Local-git logic for Corvus, Tauri-free so the shell and the headless `corvus-be` process share it. First domain: bisect (+ saved sessions). Git invocation is explicit via `GitCli` — no hidden global state to sync across processes."

[dependencies]
arbor-process-ext = { path = "../../arbor-process-ext" }
# git2 / encoding_rs are declared directly (not workspace deps); versions match
# src-tauri so Cargo unifies them (incl. git2's `vendored-libgit2`).
git2        = { version = "0.20", features = ["vendored-libgit2"] }
encoding_rs = "0.8"
# Year for the LICENSE template header — pinned to src-tauri's 0.4 so Cargo
# unifies (no second copy in the tree).
chrono      = { version = "0.4" }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
# diff: base64 image-blob encoding; graph_svg: sha2 gravatar hashing; tickets:
# regex link parsing + toml link store. base64/sha2/regex are workspace deps;
# toml is not (pin matches src-tauri's 0.8).
base64      = { workspace = true }
sha2        = { workspace = true }
regex       = { workspace = true }
toml        = "0.8"
# branch::rename_remote_branch mints a temp-branch name (uuid v4) during the
# non-fast-forward rename dance. Workspace declares uuid v1 with feature v4.
uuid        = { workspace = true }
