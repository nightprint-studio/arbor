[package]
name         = "corvus-be"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Corvus backend — the headless git process for Model D. Stage 1: serves a self-test method set over framed-stdio IPC; the git domains move in next."

[[bin]]
name = "corvus-be"
path = "src/main.rs"

[dependencies]
arbor-ipc   = { path = "../../foundation/ipc" }
arbor-rpc   = { path = "../../foundation/rpc" }
corvus-core = { path = "../core" }
corvus-git  = { path = "../git" }
git2        = { version = "0.20", features = ["vendored-libgit2"] }
serde_json  = { workspace = true }
