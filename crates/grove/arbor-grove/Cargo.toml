[package]
name         = "arbor-grove"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "grove — facade crate: re-exports the public surface of the four grove crates (pattern + lang + audio + engine) through a single curated prelude, with one unified error type. Consumers (the Arbor shell) use `arbor_grove::prelude::*` and never reach into the individual crates."

# Thin facade: no logic of its own beyond the unified `GroveError`. It depends on
# all four grove crates and stitches their preludes into one. The only genuine
# name collision across the four preludes is the per-crate `Result` alias, which
# the facade resolves by exposing a single `GroveError`/`Result` (see error.rs);
# every other symbol is either single-homed or an identical re-export.
[dependencies]
arbor-grove-pattern = { path = "../arbor-grove-pattern" }
arbor-grove-lang    = { path = "../arbor-grove-lang" }
arbor-grove-audio   = { path = "../arbor-grove-audio" }
arbor-grove-engine  = { path = "../arbor-grove-engine" }
thiserror.workspace = true

[lints.rust]
missing_debug_implementations = "warn"
