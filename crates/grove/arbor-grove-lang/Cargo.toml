[package]
name         = "arbor-grove-lang"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "grove — the .grove language: text ↔ Pattern. Tree-sitter front end → typed AST → evaluator (text → Pattern) + emitter (AST → source) + span-aware error reporting."

# Depends only on the pure pattern algebra (Fase 0) for now. The Tree-sitter
# front end (`tree-sitter` runtime + `cc` build-dep + generated `parser.c`) is
# wired in a later step, once the AST contract below is confirmed; until then
# the crate builds the pure layers (ast / error / eval / emit) with zero
# external dependencies, exactly like the pattern crate.
[dependencies]
arbor-grove-pattern = { path = "../arbor-grove-pattern" }

[lints.rust]
missing_debug_implementations = "warn"
