[package]
name         = "arbor-nemus-engine"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "nemus — timing runtime: look-ahead scheduler (Pattern → sample-accurate VoiceEvents), cps clock with quantized re-eval/tempo swap, transport, and the offline render driver (→ WAV). Depends on pattern + audio, NOT on lang."

# The scheduler/transport over the frozen audio seam. Depends on the pure
# algebra (`Pattern`/`ControlMap`/`Tracks`) and the audio crate's contract
# (`VoiceEvent`/`AudioSink`/`Renderer`). It does NOT depend on `arbor-nemus-lang`:
# the shell evaluates source → `Tracks` and hands those in. `hound` is here for
# the offline render driver (engine-driven, non-real-time → WAV).
[dependencies]
arbor-nemus-pattern = { path = "../arbor-nemus-pattern" }
arbor-nemus-audio   = { path = "../arbor-nemus-audio" }
thiserror.workspace = true
hound = "3"
# MIDI (SMF) writer for the offline MIDI export (`midi::export_midi`) — pure-Rust,
# zero system deps, same crate the import/transcribe path already uses.
midly.workspace = true
# Ogg Vorbis encoder for the offline render's OGG export (vendored libvorbis/aoTuV,
# no system deps — same vendored-C posture as git2/mlua). Quarantined behind
# `encode::OggSink` so it's swappable.
vorbis_rs = "0.5"
# EBU R128 / ITU-R BS.1770 loudness meter for the offline render's optional LUFS
# normalization. Pure-Rust port of libebur128, no system deps.
ebur128 = "0.1"

[lints.rust]
missing_debug_implementations = "warn"
