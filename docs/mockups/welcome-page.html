<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arbor — welcome page, draft</title>
<style>
  /* The values of Arbor's own `preset-github-dark` theme (--bg-base, --bg-elevated, --border, --text-*, --accent…), so the draft reads like the real thing. */
  :root {
    --canvas: #0d1117; --subtle: #161b22; --inset: #161b22; --overlay: #1c2128;
    --border: #30363d; --border-muted: #21262d;
    --fg: #e6edf3; --fg-muted: #7d8590; --fg-subtle: #6e7681;
    --accent: #2f81f7; --accent-fg: #79c0ff; --accent-soft: rgba(47,129,247,.14);
    --success: #3fb950; --danger: #f85149;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--inset); color: var(--fg); font: 14px/1.5 var(--font); }
  button { font: inherit; color: inherit; }
  kbd {
    font: 11px var(--mono); padding: 1px 6px; border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 6px; background: var(--subtle); color: var(--fg-muted);
  }

  /* ── window shape: chrome on the darkest tone, one floating panel ─────────────────── */
  .win { height: 100vh; display: flex; flex-direction: column; }
  .titlebar { height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 12px; color: var(--fg-muted); font-size: 12px; }
  .dots { display: flex; gap: 7px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--border); }
  .tab { padding: 5px 12px; border-radius: 7px 7px 0 0; background: var(--canvas); color: var(--fg); font-size: 12px; }
  .panel { flex: 1; margin: 0 6px 6px; border-radius: 12px; overflow: auto; position: relative; }

  /* The background is the products' own palette, not one blue: teal, amber and green pools on ink, a dot grid
     that fades toward the edges, and a slow drift. No backdrop-filter anywhere. */
  .panel {
    background:
      radial-gradient(900px 420px at 8% -6%,  rgba(57,197,207,.17), transparent 62%),
      radial-gradient(760px 380px at 94% 4%,  rgba(210,153,34,.13), transparent 60%),
      radial-gradient(900px 480px at 50% 112%, rgba(63,185,80,.11), transparent 62%),
      var(--canvas);
  }
  .grid-dots {
    position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(230,237,243,.10) 1px, transparent 1.2px); background-size: 24px 24px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 22%, #000, transparent 75%); mask-image: radial-gradient(ellipse 70% 60% at 50% 22%, #000, transparent 75%);
    animation: dots 40s linear infinite;
  }
  @keyframes dots { to { background-position: 24px 24px; } }

  .page { position: relative; max-width: 1040px; margin: 0 auto; padding: 44px 28px 80px; }
  .rise { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { .rise, .grid-dots, .caret { animation: none; } }

  /* ── greeting + omnibox: the one thing to aim at ───────────────────────────────────── */
  h1 { margin: 0; min-height: 1.25em; font-size: 34px; line-height: 1.25; letter-spacing: -.02em; font-weight: 650; }
  /* the sub line is a prompt waiting for input: a chevron, a phrase typed and wiped in turn, one block caret that
     sits on whichever line is being written */
  .sub { display: flex; align-items: baseline; gap: 9px; margin: 6px 0 24px; min-height: 1.6em; color: var(--fg-muted); font: 15px/1.6 var(--mono); }
  .chev { color: var(--accent-fg); }
  .caret { display: inline-block; width: .55em; height: 1.05em; margin-left: 2px; vertical-align: -.17em; background: var(--accent-fg); border-radius: 1px; animation: blink 1.05s steps(1) infinite; }
  h1 .caret { width: 3px; height: .95em; vertical-align: -.1em; }
  @keyframes blink { 50% { opacity: 0; } }
  .omni { position: relative; z-index: 30; }
  .omni-box {
    display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px;
    background: var(--subtle); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 8px 28px rgba(1,4,9,.45); transition: border-color .15s, box-shadow .15s;
  }
  .omni-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), 0 8px 28px rgba(1,4,9,.45); }
  .omni-box svg { flex: none; color: var(--fg-muted); }
  .omni-box input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font-size: 16px; }
  .omni-box input::placeholder { color: var(--fg-subtle); }
  .results {
    position: absolute; z-index: 5; left: 0; right: 0; top: 58px; max-height: 360px; overflow: auto; padding: 6px;
    background: var(--overlay); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px rgba(1,4,9,.6);
  }
  .results[hidden] { display: none; }
  .res-group { padding: 8px 10px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-subtle); }
  .res { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 8px; text-align: left; cursor: pointer; }
  .res[aria-selected="true"] { background: var(--accent-soft); }
  .res small { margin-left: auto; color: var(--fg-subtle); font: 11px var(--mono); }
  .res mark { background: none; color: var(--accent-fg); font-weight: 600; }
  .none { padding: 14px; color: var(--fg-muted); }

  /* ── resume ────────────────────────────────────────────────────────────────────────── */
  .resume {
    display: flex; align-items: center; gap: 16px; width: 100%; margin-top: 18px; padding: 16px 20px; text-align: left; cursor: pointer;
    background: linear-gradient(100deg, rgba(47,129,247,.16), rgba(137,87,229,.10) 60%, transparent), var(--subtle);
    border: 1px solid rgba(47,129,247,.45); border-radius: var(--radius);
    transition: transform .15s, border-color .15s;
  }
  .resume:hover { transform: translateY(-1px); border-color: var(--accent); }
  .resume .t { flex: 1; min-width: 0; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--accent-fg); }
  .resume b { display: block; font-size: 18px; margin: 1px 0; }
  .path { font: 12px var(--mono); color: var(--fg-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .go { display: flex; align-items: center; gap: 8px; color: var(--fg-muted); }
  .resume:hover .go { color: var(--accent-fg); }

  /* ── quick actions ─────────────────────────────────────────────────────────────────── */
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .act {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 10px; cursor: pointer;
    background: var(--subtle); border: 1px solid var(--border); border-radius: 9px; transition: border-color .15s, background .15s, transform .15s;
  }
  .act:hover { background: var(--overlay); border-color: var(--fg-subtle); transform: translateY(-1px); }
  .act .ico { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--canvas); color: var(--fg-muted); }
  .act.primary .ico { background: var(--accent); color: #fff; }
  .act b { font-weight: 600; }

  /* ── sections ──────────────────────────────────────────────────────────────────────── */
  section { margin-top: 34px; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); }
  .hint { margin-left: auto; font-size: 12px; color: var(--fg-subtle); }
  .seg { display: flex; gap: 2px; margin-left: auto; padding: 2px; background: var(--subtle); border: 1px solid var(--border-muted); border-radius: 8px; }
  .seg button { padding: 3px 11px; border: 0; background: none; border-radius: 6px; color: var(--fg-muted); cursor: pointer; font-size: 12px; }
  .seg button[aria-pressed="true"] { background: var(--overlay); color: var(--fg); box-shadow: 0 0 0 1px var(--border); }

  /* products: a strip of tall panels. The one in focus widens, slowly, and opens itself: no second panel to read. */
  .strip { --open: 224px; --shut: 112px; display: flex; align-items: flex-start; gap: 8px; height: var(--open); }  /* the full height is reserved from the start: opening a panel moves nothing around it */
  .pn {
    --c: var(--accent); position: relative; flex: 1 1 0; min-width: 0; overflow: hidden; border-radius: 18px;
    height: var(--shut); background: var(--subtle); border: 1px solid var(--border-muted);
    transition: flex .65s cubic-bezier(.22,.8,.22,1), height .65s cubic-bezier(.22,.8,.22,1), border-color .5s, box-shadow .65s;
  }
  .pn[data-on="true"] { flex: 4.4; height: var(--open); border-color: color-mix(in srgb, var(--c) 55%, var(--border)); box-shadow: 0 18px 44px color-mix(in srgb, var(--c) 18%, transparent); }
  /* the colour rises from the bottom corner as it opens */
  .pn::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transform: translateY(40%);
    background: radial-gradient(130% 100% at 0% 100%, color-mix(in srgb, var(--c) 42%, transparent), color-mix(in srgb, var(--c) 8%, transparent) 55%, transparent 78%);
    transition: opacity .7s ease, transform .8s cubic-bezier(.22,.8,.22,1);
  }
  .pn[data-on="true"]::before { opacity: 1; transform: none; }
  .hit { position: absolute; inset: 0; border: 0; background: none; cursor: pointer; border-radius: inherit; }
  .hit:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .pn .tile {
    position: absolute; top: 16px; left: calc(50% - 23px); width: 46px; height: 46px; border-radius: 13px; pointer-events: none;
    transition: left .65s cubic-bezier(.22,.8,.22,1), top .65s cubic-bezier(.22,.8,.22,1), transform .65s cubic-bezier(.3,1.5,.5,1), box-shadow .65s;
  }
  .pn:hover .tile { transform: scale(1.12) rotate(-5deg); }
  .pn[data-on="true"] .tile { top: 22px; left: 22px; transform: scale(1.18) rotate(-4deg); box-shadow: 0 14px 30px color-mix(in srgb, var(--c) 50%, transparent); }
  /* collapsed: the name sits flat under the icon, where it reads */
  .vn {
    position: absolute; left: 4px; right: 4px; bottom: 14px; text-align: center; font-size: 13px; font-weight: 600; color: var(--fg-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; transition: opacity .35s, color .35s;
  }
  .pn:hover .vn { color: var(--fg); }
  .pn[data-on="true"] .vn { opacity: 0; }
  .live { position: absolute; top: 12px; right: 12px; width: 11px; height: 11px; border-radius: 50%; background: var(--success); animation: pulse 2s ease-out infinite; }
  .pn[data-on="true"] .live { display: none; }
  /* open: the text and the buttons arrive after the width has mostly settled; hidden ones leave the tab order */
  .pb {
    position: absolute; left: 22px; bottom: 20px; width: 310px; opacity: 0; transform: translateY(14px); visibility: hidden;
    transition: opacity .35s ease, transform .35s ease, visibility 0s .35s;
  }
  .pn[data-on="true"] .pb { opacity: 1; transform: none; visibility: visible; transition: opacity .5s ease .28s, transform .5s cubic-bezier(.22,.8,.22,1) .28s, visibility 0s; }
  .pb b { font-size: 20px; letter-spacing: -.01em; } .pb .role { display: block; font-size: 12px; color: color-mix(in srgb, var(--c) 55%, var(--fg-muted)); margin-top: 1px; }
  .pb p { margin: 8px 0 12px; font-size: 13px; line-height: 1.45; color: var(--fg); opacity: .78; }
  .pb .st { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; font-size: 11px; color: var(--success); vertical-align: 2px; }
  .pb .st i { width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: pulse 2s ease-out infinite; }
  .crow { display: flex; gap: 8px; }
  @media (max-width: 760px) { .strip { flex-direction: column; height: auto; } .pn { flex: none; height: 64px; --shut: 64px; --open: 200px; transition: height .6s cubic-bezier(.22,.8,.22,1), border-color .5s; } .pn[data-on="true"] { height: 200px; } .pn .tile { top: 7px; left: 14px !important; } .vn { display: none; } .pb { left: 78px; bottom: auto; top: 10px; width: calc(100% - 92px); } }
  .tile {
    display: grid; place-items: center; width: 42px; height: 42px; border-radius: 11px; color: #fff;
    background: linear-gradient(145deg, color-mix(in srgb, var(--c) 100%, #fff 12%), color-mix(in srgb, var(--c) 70%, #000));
    box-shadow: 0 6px 16px color-mix(in srgb, var(--c) 35%, transparent);
  }
  .pill { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--success); }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(63,185,80,.6); } 100% { box-shadow: 0 0 0 8px rgba(63,185,80,0); } }
  .btn {
    padding: 5px 14px; border-radius: 7px; border: 1px solid var(--border); background: var(--overlay); cursor: pointer; font-size: 13px; transition: background .15s, border-color .15s;
  }
  .btn:hover { border-color: var(--fg-subtle); }
  .btn.open { background: color-mix(in srgb, var(--c) 26%, var(--canvas)); border-color: color-mix(in srgb, var(--c) 60%, var(--border)); font-weight: 600; }
  .btn.stop:hover { border-color: var(--danger); color: var(--danger); }

  /* recents: what you were doing, by when. Pinned first, then grouped by age; a card opens the project in its product. */
  .pins { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pin-chip { --c: var(--accent); position: relative; display: inline-flex; align-items: center; gap: 9px; padding: 7px 12px 7px 8px; border-radius: 999px; cursor: pointer; background: var(--subtle); border: 1px solid var(--border-muted); font-size: 13px; transition: border-color .4s, background .5s, transform .4s; }
  .pin-chip:hover { border-color: color-mix(in srgb, var(--c) 60%, var(--border)); background: color-mix(in srgb, var(--c) 12%, var(--subtle)); transform: translateY(-2px); }
  .pin-chip .dot { width: 22px; height: 22px; border-radius: 7px; transition: transform .45s cubic-bezier(.3,1.5,.5,1); }
  .pin-chip:hover .dot { transform: rotate(-8deg) scale(1.12); }
  .pin-chip b { font-weight: 600; } .pin-chip .star { color: #d29922; }
  .rg { margin-top: 20px; } .rg:first-of-type { margin-top: 0; }
  .rg h3 { display: flex; align-items: center; gap: 12px; margin: 0 0 10px; font-size: 12px; font-weight: 500; color: var(--fg-subtle); }
  .rg h3::after { content: ""; flex: 1; height: 1px; background: var(--border-muted); }
  .rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .rc { --c: var(--accent); position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px 14px 14px; overflow: hidden; border-radius: 14px; background: var(--subtle); border: 1px solid var(--border-muted); transition: border-color .5s, transform .5s cubic-bezier(.22,.8,.22,1), box-shadow .6s; }
  .rc::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transform: translateX(-30%); background: linear-gradient(100deg, color-mix(in srgb, var(--c) 24%, transparent), transparent 62%); transition: opacity .6s, transform .7s cubic-bezier(.22,.8,.22,1); }
  .rc:hover, .rc:focus-within { border-color: color-mix(in srgb, var(--c) 55%, var(--border)); transform: translateY(-3px); box-shadow: 0 14px 30px color-mix(in srgb, var(--c) 14%, transparent); }
  .rc:hover::before, .rc:focus-within::before { opacity: 1; transform: none; }
  .rc-hit { position: absolute; inset: 0; border: 0; background: none; cursor: pointer; border-radius: inherit; }
  .rc-hit:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .rc .dot { position: relative; flex: none; width: 40px; height: 40px; border-radius: 12px; pointer-events: none; transition: transform .55s cubic-bezier(.3,1.5,.5,1), box-shadow .55s; }
  .rc:hover .dot, .rc:focus-within .dot { transform: scale(1.12) rotate(-5deg); box-shadow: 0 8px 18px color-mix(in srgb, var(--c) 45%, transparent); }
  .rc .tx { position: relative; flex: 1; min-width: 0; pointer-events: none; }
  .rc .tx b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc .meta { display: block; font-size: 12px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc .path { display: block; margin-top: 1px; font-size: 11px; }
  .rc .side { position: relative; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 64px; pointer-events: none; }
  .rc .when { font-size: 12px; color: var(--fg-subtle); }
  .rc .acts { position: absolute; right: 0; bottom: -2px; display: flex; gap: 2px; opacity: 0; transform: translateX(10px); transition: opacity .45s .08s, transform .5s cubic-bezier(.22,.8,.22,1) .08s; pointer-events: auto; }
  .rc:hover .acts, .rc:focus-within .acts { opacity: 1; transform: none; }
  .rc:hover .when, .rc:focus-within .when { opacity: 0; } .rc .when { transition: opacity .3s; }
  .ib { display: grid; place-items: center; width: 28px; height: 28px; border: 0; border-radius: 8px; background: var(--overlay); color: var(--fg-muted); cursor: pointer; transition: color .25s, background .25s; }
  .ib:hover { color: var(--fg); background: var(--border); } .ib.on { color: #d29922; } .ib.del:hover { color: var(--danger); }
  .more { margin-top: 14px; padding: 6px 14px; border: 1px dashed var(--border); border-radius: 9px; background: none; color: var(--fg-muted); cursor: pointer; font-size: 13px; transition: color .25s, border-color .25s; }
  .more:hover { color: var(--fg); border-color: var(--fg-subtle); }
  .none { padding: 18px; color: var(--fg-muted); }
  .res .dot { display: grid; place-items: center; flex: none; color: #fff; background: var(--c); border-radius: 7px; }
  @media (max-width: 760px) { .rgrid { grid-template-columns: 1fr; } }

  footer { position: sticky; bottom: 0; margin-top: 40px; padding: 12px 0; display: flex; flex-wrap: wrap; gap: 18px; color: var(--fg-subtle); font-size: 12px; background: linear-gradient(transparent, var(--canvas) 40%); }
  footer span { display: inline-flex; align-items: center; gap: 6px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; padding: 9px 16px; background: var(--overlay); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 10px 30px rgba(1,4,9,.6); transition: .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.act { pointer-events: auto; display: flex; align-items: center; gap: 14px; }
  .toast button { border: 0; background: none; color: var(--accent-fg); font-weight: 600; cursor: pointer; }
  @media (max-width: 640px) { .page { padding: 28px 16px 80px; } h1 { font-size: 26px; } .when, .chip { display: none; } }
</style>
</head>
<body>
<div class="win">
  <div class="titlebar"><div class="dots"><i></i><i></i><i></i></div><span class="tab">Home</span><span>Corvus</span><span>Bennu</span></div>
  <div class="panel">
    <div class="grid-dots" aria-hidden="true"></div>
    <main class="page">
      <header class="hero rise" style="--i:0">
        <h1 id="hello" aria-live="polite"></h1>
        <p class="sub" id="line"><span class="chev" aria-hidden="true">›</span><span id="phrase"></span></p>
      </header>

      <div class="omni rise" style="--i:1">
        <label class="omni-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="q" autocomplete="off" spellcheck="false" placeholder="Open a project, start a product, run an action…" aria-label="Search" role="combobox" aria-expanded="false" aria-controls="res">
          <kbd>/</kbd>
        </label>
        <div class="results" id="res" role="listbox" hidden></div>
      </div>

      <button class="resume rise" style="--i:2" id="resume" type="button"></button>

      <div class="actions rise" style="--i:3" id="actions"></div>

      <section class="rise" style="--i:4">
        <div class="head"><h2>Products</h2><span class="hint"><kbd>←</kbd> <kbd>→</kbd> browse · <kbd>Enter</kbd> open</span></div>
        <div class="strip" id="strip" role="group" aria-label="Products"></div>
      </section>

      <section class="rise" style="--i:5">
        <div class="head"><h2>Recent projects</h2>
          <div class="seg" role="group" aria-label="Filter recents" id="rf"></div></div>
        <div id="recents"></div>
      </section>

      <footer>
        <span><kbd>/</kbd> search</span><span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> move between projects</span>
        <span><kbd>Enter</kbd> open</span><span><kbd>P</kbd> pin</span><span><kbd>Del</kbd> remove from the list</span>
      </footer>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
  // ── data (sample) ─────────────────────────────────────────────────────────────────────
  const I = {
    git: '<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
    code: '<path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/>',

    const groups = find(); items = groups.flatMap(([, l]) => l); sel = Math.min(sel, Math.max(0, items.length - 1));
    const s = q.value.trim().toLowerCase(); let n = 0;
    res.innerHTML = items.length ? groups.map(([g, l]) => `<div class="res-group">${g}</div>${l.map((it) => `<button class="res" role="option" data-n="${n}" aria-selected="${n++ === sel}">
      <span class="dot" style="--c:${it.c};width:22px;height:22px">${svg(it.i, 12)}</span><span>${hl(it.t, s)}</span><small>${it.d}</small></button>`).join('')}`).join('') : '<div class="none">No match. Try a project, a product or “clone”.</div>';
    res.hidden = false; q.setAttribute('aria-expanded', 'true');
    res.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
  }
  const close = () => { res.hidden = true; q.setAttribute('aria-expanded', 'false'); };
  q.addEventListener('focus', drawResults); q.addEventListener('input', () => { sel = 0; drawResults(); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % Math.max(1, items.length); drawResults(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = (sel - 1 + items.length) % Math.max(1, items.length); drawResults(); }
    else if (e.key === 'Enter') { e.preventDefault(); items[sel]?.run(); q.value = ''; q.blur(); close(); }
    else if (e.key === 'Escape') { q.value = ''; q.blur(); close(); }
  });
  res.addEventListener('mousedown', (e) => { const b = e.target.closest('[data-n]'); if (b) { e.preventDefault(); items[+b.dataset.n].run(); q.value = ''; q.blur(); close(); } });
  document.addEventListener('click', (e) => { if (!e.target.closest('.omni')) close(); });

  // ── keyboard: / to search, 1–9 to open a recent, P to pin the one you are on ──────────
  document.addEventListener('keydown', (e) => {
    if (e.target === q || e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input,textarea')) return;
    if (e.key === '/') { e.preventDefault(); q.focus(); }
    else if (/^[1-9]$/.test(e.key) && shown()[+e.key - 1]) openRecent(shown()[+e.key - 1]);
    else if (e.key.toLowerCase() === 'p' && current && byKey(current)) { const k = current; togglePin(byKey(k)); focusKey(k); }
  });

  drawStrip(); drawRecents(); run();
</script>
</body>
</html>
