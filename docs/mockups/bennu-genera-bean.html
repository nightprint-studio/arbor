<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bennu · Genera bean (mockup v2)</title>
<style>
  :root {
    --bg: #0d1117; --canvas: #161b22; --inset: #010409; --overlay: #1c2128;
    --border: #30363d; --border-muted: #21262d;
    --fg: #e6edf3; --fg-muted: #8b949e; --fg-subtle: #6e7681;
    --blue: #58a6ff; --blue-bg: rgba(56,139,253,.13);
    --green: #3fb950; --green-bg: rgba(46,160,67,.14); --btn-green: #238636; --btn-green-h: #2ea043;
    --red: #f85149; --yellow: #d29922; --yellow-bg: rgba(187,128,9,.15);
    --purple: #d2a8ff; --orange: #ffa657; --cyan: #79c0ff; --lred: #ff7b72;
    --radius: 6px; --radius-lg: 12px; --foot: 57px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
  button, input, select { font: inherit; color: inherit; }

  /* fake editor behind the dialog */
  .editor { position: fixed; inset: 0; padding: 56px 0 0 40px; font: 13px/20px var(--mono); color: var(--fg-subtle); overflow: hidden; }
  .editor .tab { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: var(--canvas); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding-left: 16px; font: 13px var(--sans); color: var(--fg-muted); gap: 8px; }
  .editor .tab b { color: var(--fg); font-weight: 500; }
  .editor .k { color: var(--lred); } .editor .a { color: var(--orange); } .editor .t { color: var(--orange); }
  .scrim { position: fixed; inset: 0; background: rgba(1,4,9,.72); }

  .modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; }
  .dialog { position: relative; width: min(1180px, 100%); height: min(720px, 100%); background: var(--canvas); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: 0 24px 80px rgba(1,4,9,.85); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }

  header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 2px; gap: 2px; }
  .seg button { background: none; border: 0; padding: 3px 12px; border-radius: 4px; color: var(--fg-muted); cursor: pointer; font-size: 13px; }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-selected="true"] { background: var(--overlay); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border); }
  .seg button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .seg kbd { margin-left: 6px; }
  header .spacer { flex: 1; }
  .mock { font-size: 11px; color: var(--yellow); background: var(--yellow-bg); border: 1px solid rgba(187,128,9,.4); padding: 2px 8px; border-radius: 999px; }

  .body { display: grid; grid-template-columns: minmax(400px, .9fr) minmax(420px, 1.1fr); min-height: 0; }
  .form { overflow: auto; padding: 16px 18px 20px; border-right: 1px solid var(--border); min-height: 0; }
  h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-subtle); margin: 18px 0 8px; font-weight: 600; }
  h2:first-child { margin-top: 0; }

  .detected { display: flex; flex-wrap: wrap; gap: 5px 12px; font-size: 12px; color: var(--fg-muted); margin-bottom: 4px; }
  .detected span::before { content: "✓ "; color: var(--green); } .detected span.no::before { content: "– "; color: var(--fg-subtle); } .detected span.no { color: var(--fg-subtle); }

  /* scenario cards: native radios, so ↑↓←→ work for free */
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { position: relative; display: block; padding: 10px 12px 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); cursor: pointer; min-height: 78px; }
  .card:hover { border-color: var(--fg-subtle); }
  .card input { position: absolute; opacity: 0; }
  .card b { display: block; font-weight: 600; font-size: 13.5px; padding-right: 20px; }
  .card small { display: block; color: var(--fg-muted); font-size: 12px; line-height: 1.4; margin-top: 2px; }
  .card .tag { display: inline-block; margin-top: 6px; font: 11px var(--mono); color: var(--fg-subtle); }
  .card:has(input:checked) { border-color: var(--blue); background: var(--blue-bg); }
  .card:has(input:checked)::after { content: "✓"; position: absolute; right: 10px; top: 8px; color: var(--blue); font-weight: 700; }
  .card:has(input:focus-visible) { outline: 2px solid var(--blue); outline-offset: 2px; }
  .card:has(input:disabled) { opacity: .5; cursor: not-allowed; }
  .card .need { display: block; color: var(--yellow); font-size: 11.5px; margin-top: 4px; }

  /* option pills */
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .group > em { font-style: normal; font-size: 12px; color: var(--fg-muted); min-width: 92px; }
  .pill { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); color: var(--fg-muted); font-size: 12.5px; cursor: pointer; user-select: none; }
  .pill:hover { border-color: var(--fg-subtle); color: var(--fg); }
  .pill input { position: absolute; opacity: 0; }
  .pill:has(input:checked) { color: var(--green); border-color: rgba(63,185,80,.5); background: var(--green-bg); }
  .pill:has(input:checked)::before { content: "✓"; font-size: 11px; }
  .pill:has(input:focus-visible) { outline: 2px solid var(--blue); outline-offset: 2px; }
  .pill small { color: var(--fg-subtle); font-size: 11px; }
  .warn { font-size: 12px; color: var(--yellow); margin: 2px 0 0; }

  /* inputs */
  input[type="text"], select { width: 100%; min-width: 0; background: var(--inset); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 9px; font: 13px var(--mono); }
  select { font-family: var(--sans); font-size: 12.5px; padding: 5px 6px; }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(56,139,253,.3); }
  input[disabled] { color: var(--fg-subtle); }
  .x { background: none; border: none; color: var(--fg-subtle); cursor: pointer; border-radius: var(--radius); height: 28px; } .x:hover { color: var(--red); background: var(--overlay); }
  .x:focus-visible { outline: 2px solid var(--blue); }
  .ghostbtn { background: none; border: 1px dashed var(--border); color: var(--fg-muted); border-radius: var(--radius); padding: 4px 11px; font: 12.5px var(--sans); cursor: pointer; }
  .ghostbtn:hover { color: var(--fg); border-color: var(--fg-subtle); } .ghostbtn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .hint { font-size: 12px; color: var(--fg-subtle); margin-left: 8px; } .hint kbd { font-size: 10.5px; }

  /* rules */
  .rules { display: grid; gap: 6px; }
  .rule { display: grid; grid-template-columns: 82px 1fr 156px 28px; gap: 6px; align-items: center; }
  .rule.locked { opacity: .62; }
  .rule.locked code { font: 12.5px var(--mono); color: var(--cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  .auto { font-size: 11px; color: var(--fg-subtle); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; text-align: center; justify-self: start; }
  .acc-static { font: 12.5px var(--mono); color: var(--fg-muted); }
  .cb { position: relative; }
  .cover { margin-top: 10px; font-size: 12.5px; color: var(--fg-muted); }
  .cover b { color: var(--fg); font-weight: 600; } .cover .ok { color: var(--green); } .cover .bad { color: var(--yellow); }
  .cover summary { cursor: pointer; } .cover ul { margin: 6px 0 0; padding: 0; list-style: none; font: 12px/1.7 var(--mono); color: var(--fg-muted); }

  /* issuers */
  .issuers { display: grid; gap: 8px; }
  .iss { display: grid; grid-template-columns: 120px 1fr 28px; grid-template-areas: "pre uri x" "aud claim claim"; gap: 6px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); }
  .iss .pre { grid-area: pre; } .iss .uri { grid-area: uri; } .iss .x { grid-area: x; } .iss .aud { grid-area: aud; } .iss .claim { grid-area: claim; }
  .iss .row2 { display: contents; }
  .lbl { font-size: 11px; color: var(--fg-subtle); }

  /* endpoint popup (global, fixed so the scrolling form can't clip it) */
  #pop { position: fixed; z-index: 60; background: var(--overlay); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 12px 32px rgba(1,4,9,.7); overflow: auto; padding: 4px 0; }
  #pop[hidden] { display: none; }
  #pop .sec { padding: 6px 12px 3px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-subtle); font-weight: 600; }
  #pop .ctrl { padding: 5px 12px 1px; font-size: 11.5px; color: var(--fg-muted); }
  #pop .ctrl em { font-style: normal; color: var(--fg-subtle); }
  #pop [role=option] { display: flex; align-items: center; gap: 8px; padding: 3px 12px; font: 12.5px var(--mono); cursor: pointer; }
  #pop [role=option][aria-selected="true"] { background: var(--blue-bg); box-shadow: inset 2px 0 0 var(--blue); }
  #pop [role=option] .n { margin-left: auto; font: 11px var(--sans); color: var(--fg-subtle); }
  #pop .none { padding: 10px 12px; color: var(--fg-muted); font-size: 12.5px; }
  .m { font: 600 10px var(--mono); width: 42px; text-align: center; border-radius: 4px; padding: 1px 0; flex: none; }
  .m.GET { color: var(--green); background: rgba(63,185,80,.14); } .m.POST { color: var(--cyan); background: rgba(56,139,253,.16); }
  .m.DELETE { color: var(--red); background: rgba(248,81,73,.14); } .m.PUT, .m.PATCH { color: var(--orange); background: rgba(255,166,87,.14); }
  .m.ALL { color: var(--fg-subtle); background: var(--border-muted); }

  /* preview */
  .preview { background: var(--inset); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .ptabs { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--border-muted); font-size: 12px; color: var(--fg-muted); background: transparent; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
  .ptabs b { color: var(--fg); font-weight: 500; font-family: var(--mono); }
  .ptabs .grow { flex: 1; } .ptabs .chev { display: none; }
  .code { overflow: auto; padding: 10px 0; font: 12.5px/20px var(--mono); min-height: 0; }
  .ln { display: grid; grid-template-columns: 38px 1fr; white-space: pre; background: var(--green-bg); box-shadow: inset 3px 0 0 var(--green); }
  .ln i { font-style: normal; color: var(--green); text-align: right; padding-right: 12px; user-select: none; }
  .ln.blank { background: none; box-shadow: none; }
  .imports { padding: 8px 14px; border-top: 1px solid var(--border-muted); font-size: 12px; color: var(--fg-muted); max-height: 160px; overflow: auto; }
  .imports summary { cursor: pointer; } .imports code { display: block; font: 11.5px/18px var(--mono); margin-top: 6px; white-space: pre; }
  .side { padding: 8px 14px 10px; border-top: 1px solid var(--border-muted); font-size: 12px; color: var(--fg-muted); }
  .side ul { margin: 4px 0 0; padding: 0; list-style: none; } .side li::before { content: "＋ "; color: var(--green); } .side code { font: 11.5px var(--mono); color: var(--cyan); }
  .c { color: #8b949e; font-style: italic; } .s { color: #a5d6ff; } .a { color: var(--orange); } .k { color: var(--lred); } .t { color: var(--orange); }

  footer { position: relative; z-index: 3; display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--border); background: var(--canvas); min-height: var(--foot); }
  footer .where { color: var(--fg-muted); font-size: 12.5px; min-width: 0; } footer .where code { font: 12px var(--mono); color: var(--fg); }
  footer .spacer { flex: 1; }
  .btn { font: 500 13px var(--sans); padding: 5px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--overlay); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
  .btn:hover { border-color: var(--fg-subtle); }
  .btn.primary { background: var(--btn-green); border-color: rgba(240,246,252,.1); color: #fff; } .btn.primary:hover { background: var(--btn-green-h); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  kbd { font: 11px var(--mono); padding: 1px 6px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; color: var(--fg-muted); background: var(--bg); }
  .btn.primary kbd { background: rgba(0,0,0,.2); border-color: rgba(255,255,255,.25); color: #fff; }

  .toast { position: fixed; left: 50%; bottom: 80px; transform: translate(-50%, 20px); background: var(--overlay); border: 1px solid var(--green); padding: 8px 14px; border-radius: var(--radius); opacity: 0; transition: .2s; pointer-events: none; z-index: 90; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* phone / narrow: full-screen dialog, preview becomes a bottom sheet whose header is the handle */
  @media (max-width: 860px) {
    .modal { padding: 0; } .dialog { height: 100%; border-radius: 0; border: 0; }
    .body { grid-template-columns: 1fr; }
    .form { border-right: 0; padding-bottom: 70px; }
    .preview { position: absolute; left: 0; right: 0; bottom: var(--foot); height: 72%; z-index: 2; border-top: 1px solid var(--border); box-shadow: 0 -10px 30px rgba(1,4,9,.6); transform: translateY(calc(100% - 41px)); transition: transform .22s ease; }
    .preview.open { transform: none; }
    .ptabs { cursor: pointer; } .ptabs .chev { display: inline; transition: transform .2s; } .preview.open .chev { transform: rotate(180deg); }
    .cards { grid-template-columns: 1fr; } .card { min-height: 0; }
    .rule { grid-template-columns: 82px 1fr 28px; grid-template-areas: "path path path" "meth acc x"; }
    .rule .cb { grid-area: path; } .rule .meth, .rule .auto { grid-area: meth; } .rule .acc { grid-area: acc; } .rule .x { grid-area: x; }
    .rule.locked { grid-template-areas: "meth code code"; } .rule.locked code { grid-area: code; }
    .group > em { min-width: 100%; }
    footer .where { display: none; } footer .btn kbd { display: none; } header .mock { display: none; }
  }
</style>

<script>
/* ============ data the real feature would read from the Bennu index ============ */
// controllers found in the app: root = class-level mapping, eps = method-level mappings
const ENDPOINTS = [
  { ctrl: 'AuthController',   root: '/auth',       eps: [['POST', '/auth/login'], ['POST', '/auth/refresh']] },
  { ctrl: 'PublicController', root: '/public',     eps: [['GET', '/public/catalog'], ['GET', '/public/catalog/{sku}']] },
  { ctrl: 'UserController',   root: '/api/users',  eps: [['GET', '/api/users'], ['GET', '/api/users/{id}'], ['POST', '/api/users'], ['DELETE', '/api/users/{id}']] },
  { ctrl: 'OrderController',  root: '/api/orders', eps: [['GET', '/api/orders'], ['GET', '/api/orders/{id}'], ['POST', '/api/orders'], ['POST', '/api/orders/{id}/cancel']] },
  { ctrl: 'AdminController',  root: '/admin',      eps: [['GET', '/admin/stats'], ['POST', '/admin/reindex']] },
];
const ALL_EPS = ENDPOINTS.flatMap(c => c.eps.map(([m, p]) => ({ method: m, path: p, ctrl: c.ctrl })));
const PRESETS = {
  Keycloak: { iss: 'https://sso.acme.com/realms/shop', claim: 'realm_access.roles' },
  Auth0:    { iss: 'https://acme.eu.auth0.com/', claim: 'permissions' },
  Okta:     { iss: 'https://acme.okta.com/oauth2/default', claim: 'groups' },
  'Azure AD': { iss: 'https://login.microsoftonline.com/{tenant}/v2.0', claim: 'roles' },
  Custom:   { iss: '', claim: 'roles' },
};
const ACCESS = ['permitAll()', 'authenticated()', 'denyAll()', 'hasRole("ADMIN")', 'hasRole("USER")', 'hasAuthority("SCOPE_read")'];
const METHODS = ['GET', 'POST', 'PUT', 'PATCH', 'DELETE'];

/* ============ state ============ */
const S = {
  recipe: 'security',
  security: {
    scenario: 'jwt', swagger: true, health: true, cors: true, csrf: false, devUser: false,
    issuers: [{ p: 'Keycloak', iss: PRESETS.Keycloak.iss, aud: 'shop-api', claim: PRESETS.Keycloak.claim }],
    rules: [
      { method: '', path: '/public/**', access: 'permitAll()' },
      { method: '', path: '/auth/**', access: 'permitAll()' },
      { method: 'POST', path: '/api/orders/{id}/cancel', access: 'hasRole("ADMIN")' },
      { method: '', path: '/admin/**', access: 'hasRole("ADMIN")' },
    ],
    any: 'authenticated()',
  },
  converter: { scenario: 'LocalDate', auto: true, nullsafe: true },
  jackson: { scenario: 'both', type: 'Money', module: false },
};

/* ============ helpers ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const narrow = () => matchMedia('(max-width: 860px)').matches;

function pathRegex(p) {
  const base = p.endsWith('/**') ? p.slice(0, -3) : p, open = p.endsWith('/**');
  const re = base.replace(/[.+^$()|[\]\\]/g, '\\$&').replace(/\*/g, '[^/]*').replace(/\{[^}]+\}/g, '[^/]+');
  return new RegExp('^' + re + (open ? '(?:/.*)?' : '') + '$');
}
function coverage(s) {
  const rules = s.rules.filter(r => r.path.trim()).map(r => ({ ...r, re: pathRegex(r.path.trim()) }));
  const uncovered = ALL_EPS.filter(e => { const concrete = e.path.replace(/\{[^}]+\}/g, 'x'); return !rules.some(r => (!r.method || r.method === e.method) && r.re.test(concrete)); });
  return { total: ALL_EPS.length, uncovered };
}

/* ============ widgets ============ */
const card = (v, cur, title, desc, tag, off, need) => `<label class="card"><input type="radio" name="scenario" value="${v}" ${cur === v ? 'checked' : ''} ${off ? 'disabled' : ''}>
  <b>${title}</b><small>${desc}</small>${tag ? `<span class="tag">${tag}</span>` : ''}${need ? `<span class="need">${need}</span>` : ''}</label>`;
const pill = (key, label, on, sub) => `<label class="pill"><input type="checkbox" data-k="${key}" ${on ? 'checked' : ''}>${label}${sub ? ` <small>${sub}</small>` : ''}</label>`;

/* ============ recipes ============ */
const R = {};

R.security = {
  sub: 'Spring Security 6.2.3',
  where: () => 'Inserisce in <code>SecurityConfig.java</code> alla riga <code>8</code> (caret)',
  file: () => 'SecurityConfig.java',
  detected: `<span>Spring Security 6.2.3</span><span>springdoc-openapi 2.5</span><span>actuator</span><span>oauth2-resource-server</span><span>PasswordEncoder · AppConfig.java:18</span><span class="no">oauth2-client</span><span class="no">UserDetailsService</span>`,
  scenarios() {
    const s = S.security, n = s.issuers.length;
    return card('jwt', s.scenario, 'API con JWT', 'Resource server stateless, un solo issuer.', 'stateless · 1 issuer')
      + card('multi', s.scenario, 'API multi-issuer', 'Più identity provider, ognuno con audience e ruoli suoi.', `stateless · ${Math.max(n, 2)} issuer`)
      + card('form', s.scenario, 'Web con login a form', 'Sessione e pagina di login.', 'sessione · CSRF')
      + card('webapi', s.scenario, 'Web e API insieme', 'Due catene: /api/** con JWT, il resto con login a form.', '2 SecurityFilterChain')
      + card('oauth2', s.scenario, 'Login con provider', 'Google, GitHub, Keycloak…', '', true, 'manca spring-boot-starter-oauth2-client · aggiungi dipendenza');
  },
  options() {
    const s = S.security, usesForm = s.scenario === 'form' || s.scenario === 'webapi';

/* ============ highlighting: one pass, so a keyword inside a string is not recoloured ============ */
function hl(code) {
  const re = /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|(@[A-Za-z]+)|\b(public|private|class|return|new|null|implements|extends|throws|static|final|void|for|instanceof)\b|\b([A-Z][A-Za-z0-9_]*)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index)).replace(/&quot;/g, '"');
    out += `<span class="${m[1] ? 'c' : m[2] ? 's' : m[3] ? 'a' : m[4] ? 'k' : 't'}">${esc(m[0]).replace(/&quot;/g, '"')}</span>`; last = re.lastIndex;
  }
  return out + esc(code.slice(last)).replace(/&quot;/g, '"');
}

  const input = cbInput; cbClose(); input.focus(); update();
}
function cbKey(e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); if (!cbInput) cbOpen(e.target, true); cbMove(1); }
  else if (e.key === 'ArrowUp' && cbInput) { e.preventDefault(); cbMove(-1); }
  else if (e.key === 'Enter' && cbInput && cbIndex >= 0 && !(e.ctrlKey || e.metaKey)) { e.preventDefault(); cbPick(cbIndex); }
  else if (e.key === 'Escape' && cbInput) { e.preventDefault(); e.stopPropagation(); cbClose(); }
  else if (e.key === 'Tab') cbClose();
}
pop.addEventListener('mousedown', e => { e.preventDefault(); const o = e.target.closest('[role=option]'); if (o) cbPick(+o.dataset.i); });

/* ============ render ============ */
function update() {
  const r = R[S.recipe], lines = r.gen();
  $('pfile').textContent = r.file(); $('where').innerHTML = r.where();
  $('code').innerHTML = lines.map((l, i) => `<div class="ln ${l === '' ? 'blank' : ''}"><i>${8 + i}</i><span>${hl(l)}</span></div>`).join('');
  $('pcount').textContent = `+${lines.length} righe`;
  const imps = r.imports(), side = r.side();
  $('pextra').innerHTML = `<details class="imports"><summary>${imps.length} import aggiunti automaticamente</summary><code>${imps.map(i => 'import ' + i + ';').join('\n')}</code></details>`
    + (side.length ? `<div class="side">Modifiche collaterali<ul>${side.map(x => `<li>${x}</li>`).join('')}</ul></div>` : '');
  r.refresh?.();
}
function renderForm() {
  const r = R[S.recipe]; cbClose(); r.normalise?.();
  $('form').innerHTML = `<div class="detected">${r.detected}</div><h2 id="sc">Scenario</h2><div class="cards" role="radiogroup" aria-labelledby="sc">${r.scenarios()}</div>
    <h2>Opzioni</h2><div id="opts">${r.options()}</div>${r.sections()}`;
  r.bind?.();
  update();
}
function show(name, focus = true) {
  S.recipe = name;
  document.querySelectorAll('#recipes [role=tab]').forEach(b => { const on = b.dataset.r === name; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
  renderForm();
  if (focus) $('form').querySelector('input[name=scenario]:checked')?.focus();
}
$('form').addEventListener('change', e => {
  const t = e.target, st = S[S.recipe];
  if (t.name === 'scenario') { st.scenario = t.value; renderForm(); $('form').querySelector('input[name=scenario]:checked').focus(); return; }
  if (t.dataset.k) { st[t.dataset.k] = t.checked; $('opts').innerHTML = R[S.recipe].options(); R[S.recipe].paintRules?.(); $('opts').querySelector(`[data-k=${t.dataset.k}]`)?.focus(); update(); }
});

/* ============ keyboard: Alt+1/2/3 recipe, ←→ in the tabs, Ctrl+Enter insert, Esc cancel ============ */
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); };
const order = ['security', 'converter', 'jackson'];
$('recipes').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) show(b.dataset.r); });
$('recipes').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  e.preventDefault(); const i = (order.indexOf(S.recipe) + (e.key === 'ArrowRight' ? 1 : order.length - 1)) % order.length;
  show(order[i], false); document.querySelector(`[data-r=${order[i]}]`).focus();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); toast(`Inserito: ${R[S.recipe].file()} (mockup)`); }
  else if (e.key === 'Escape') toast('Annullato (mockup)');
  else if (e.altKey && /^Digit[123]$/.test(e.code)) { e.preventDefault(); show(order[+e.code.slice(5) - 1]); }
});
$('ok').onclick = () => toast(`Inserito: ${R[S.recipe].file()} (mockup)`);
$('cancel').onclick = () => toast('Annullato (mockup)');
$('phandle').onclick = () => { if (!narrow()) return; const open = $('preview').classList.toggle('open'); $('phandle').setAttribute('aria-expanded', open); };

show('security');
</script>
</body>
