[package]
name        = "arbor"
description = "Arbor — Git GUI Client"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[lib]
name = "arbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ── Cargo features ──────────────────────────────────────────────────────────
# `deep-link-dev` toggles activation of BOTH the deep-link plugin and its
# `single-instance` companion in **debug** builds.  Release builds always
# enable them (see the `cfg(any(not(debug_assertions), feature = ...))`
# guards in lib.rs), independent of this feature — so removing it from
# `default` does NOT affect packaged builds.
#
# Default-OFF for dev: opt in with `cargo tauri dev --features deep-link-dev`.
# Release builds always activate the deep-link plugin (see the
# `cfg(any(not(debug_assertions), feature = ...))` guards in lib.rs).
[features]
default = []
deep-link-dev = []
# The ONNX transcription backends (basic-pitch / Demucs) are owned out-of-process
# by `merula-be` now (its own `onnx` feature, on by default, links onnxruntime in
# the child). The shell no longer depends on the merula facade, so there is no
# `onnx` feature here to forward — the launcher builds/ships merula-be with it.
# Bundle OpenSSL from source instead of linking against the system libssl.
# Activated by the release workflow on Linux + macOS so produced binaries
# don't depend on the runner's libssl version (and so the macOS x86_64 cross
# build on the arm64 runner finds the right OpenSSL for the target).
# Off by default to keep local dev incremental builds fast and avoid the
# Perl/CMake prerequisites the vendored build needs — on Windows this feature
# is a no-op since openssl-sys isn't in the dep graph (native-tls uses
# Schannel, libgit2 uses WinHTTP).
vendored-openssl = ["dep:openssl-sys"]

# NOTE — the [profile.release] section moved to the workspace root
# Cargo.toml (../Cargo.toml) when this crate became a workspace member.
# Cargo only honours profile sections at the workspace root and silently
# ignores them in member crates. The rationale for the chosen settings
# (panic=unwind, strip=debuginfo, debug=1) is preserved in the root file's
# comment block — see "[profile.release]" there.

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
# --- Arbor crates (split out of this crate, see ../Cargo.toml workspace) ---
arbor-process-ext = { path = "../crates/platform/process-ext" }
arbor-fs          = { path = "../crates/foundation/fs" }
arbor-brp         = { path = "../crates/wasm/brp" }
# Studio backend extracted to crates/wasm/studio/*. Stage 4 collapsed the
# launcher's footprint to the api facade (registry + scanner + index +
# config + dispatch) plus the DTO crate for IPC (de)serialization. The 5
# format crates + core are pulled in transitively by `arbor-studio-api`;
# the launcher no longer names them.
arbor-studio-api   = { path = "../crates/wasm/studio/api" }
arbor-studio-types = { path = "../crates/wasm/studio/types" }
# Shared provider-descriptor types (the FE-facing connect-form metadata) — still
# used by the git-host connectors below. The issue-tracker crates
# (`corvus-issues`, `corvus-issue-tracker-{api,linear,jira}`) are gone: that whole
# domain (connect / validate / auth-status / image proxy) moved out of process
# into `corvus-be`; the launcher keeps only the OAuth engine + the keyring vault,
# which corvus-be reaches over the reverse channel.
corvus-provider-descriptor = { path = "../crates/products/corvus/provider-descriptor" }
corvus-git-provider-api = { path = "../crates/products/corvus/git-provider/api" }
corvus-git-provider-github = { path = "../crates/products/corvus/git-provider/github" }
corvus-git-provider-gitlab = { path = "../crates/products/corvus/git-provider/gitlab" }
corvus-pipeline-api = { path = "../crates/products/corvus/pipeline/api" }
corvus-pipeline-core = { path = "../crates/products/corvus/pipeline/core" }
corvus-core       = { path = "../crates/products/corvus/core" }
arbor-ipc         = { path = "../crates/foundation/ipc" }
arbor-shell-common = { path = "../crates/foundation/shell-common" }
arbor-rpc         = { path = "../crates/foundation/rpc" }
arbor-feedback    = { path = "../crates/platform/feedback" }
arbor-auth        = { path = "../crates/platform/auth" }
arbor-core        = { path = "../crates/foundation/core" }
arbor-plugin-api  = { path = "../crates/platform/plugin/api" }
arbor-plugin-core = { path = "../crates/platform/plugin/core" }
arbor-plugin-marketplace = { path = "../crates/platform/plugin/marketplace" }
arbor-plugin-types = { path = "../crates/platform/plugin/types" }
# The wasm extension host, with the runtime on: the shell is the process that actually
# instantiates a guest, so a build of it that could only *describe* extensions would be able
# to list them and never run one. The cost is wasmtime in every build of the shell.
arbor-plugin-wasm  = { path = "../crates/platform/plugin/wasm", features = ["runtime"] }
# The AI tool surface. `arbor-mcp` is the protocol (JSON-RPC + MCP + the transport
# guards); `arbor-http` is the loopback server under it. What the tools DO is
# `src/mcp/`, here in the shell, because that is where the user's consent lives.
arbor-mcp   = { path = "../crates/platform/mcp" }
arbor-http  = { path = "../crates/foundation/http" }
# `#[handler(mcp(...))]` metadata crosses the seam as `arbor_rpc::ToolDescriptor`, and
# `arbor_be::TOOLS_METHOD` names the reserved method that carries it.
arbor-be    = { path = "../crates/foundation/be" }
arbor-scheduler   = { path = "../crates/platform/scheduler" }

# --- Tauri ---
tauri             = { workspace = true }
tauri-plugin-opener       = "2.5.4"
tauri-plugin-notification = "2.3.3"
# Deep-link `arbor://…` URL handling.  The `deep-link` feature of the
# single-instance plugin makes the second invocation forward its argv to
# the running instance (so opening a link never spawns a duplicate).
# Always pulled in — actual activation is `cfg`-gated in lib.rs (release
# always on; debug only with the `deep-link-dev` Cargo feature).
tauri-plugin-deep-link        = "2"
tauri-plugin-single-instance  = { version = "2", features = ["deep-link"] }
# OS-global hotkey (Ctrl+Shift+E) that opens the dedicated File Explorer
# window — see `explorer_window.rs`. Desktop-only plugin; the app is
# desktop-only so no extra cfg gating is needed.
tauri-plugin-global-shortcut  = "2"

# --- Git ---
# The launcher runs NO git and links NO git crate: no libgit2 (the `git2` /
# `corvus-git` deps live in corvus-be), no `git` shell-outs (repo-root / origin-URL
# lookups moved to corvus-be `repo_origin_url` + sitta-be `fs_repo_root`), and no
# PortableGit path resolver (corvus-be self-computes the fixed global path).
# `similar` stays for in-shell text diffing.
similar = { workspace = true }

# --- Plugin system ---
mlua = { workspace = true }

# --- Async ---
tokio        = { workspace = true }
# Required by `git_provider::GitProvider` trait — async fns in traits via macro.
async-trait  = { workspace = true }

# --- Auth / HTTP ---
keyring = { workspace = true }
reqwest = { workspace = true }

# --- Serialization ---
serde      = { workspace = true }
serde_json = { workspace = true }
# JSON Studio (`simd-json` read path + `jsonc-parser` byte-splice edit path)
# moved to the `arbor-studio-json` crate in Stage 3 of the studio extraction,
# so `simd-json` + `jsonc-parser` no longer have a launcher consumer and were
# removed here.
# RON Studio (tag-preserving AST + JSONPath query bar + syn `.rs` schema
# loader) moved to the `arbor-studio-ron` crate in Stage 3 of the studio
# extraction, so `serde_json_path` + `syn` + `prettyplease` + `quote` no
# longer have a launcher consumer and were removed here. (The `ron` crate
# was never a host dependency — RON ships a custom AST parser because
# `ron::Value` drops enum variant tags.)
# YAML/.properties Studio + the YAML↔.properties converter all moved to
# their `arbor-studio-*` crates (Stage 3 of the studio extraction), so
# `serde_yaml_ng` + `yaml-edit` no longer have a launcher consumer and were
# removed here. (Structured plugin file edits `arbor.fs.json_set / toml_set`
# stay; there is no `yaml_set` consumer in the launcher.)
base64     = { workspace = true }

# --- Config / paths ---
dirs   = { workspace = true }
toml   = "0.8"
# `toml_edit` moved to the `arbor-studio-toml` crate in Stage 3 of the studio
# extraction (it was used only by the now-extracted TOML Studio backend).
semver = "1"

# --- File watch ---
notify = "6"

# --- Trash / Recycle Bin ---
# Cross-platform move-to-trash for the built-in file explorer's Delete action
# (Recycle Bin on Windows, Trash on macOS, freedesktop trash on Linux).
# Shift+Delete bypasses this and removes permanently via std::fs.
trash = "5"

# --- Native system icons ---
# Real shell/desktop icon for a file extension, returned as PNG bytes, for the
# built-in file explorer's `fs_icon` command. Windows → shell icons (pulls in
# the full `windows` crate + `image` transitively, Windows-only); macOS →
# NSWorkspace; Linux → GTK icon theme (needs GTK dev libs at build time).
# Folders aren't covered (the crate resolves by file attribute) — the explorer
# keeps its themed folder icon for those.
systemicons = "0.9"

# --- Error handling ---
thiserror = { workspace = true }

# --- Logging ---
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- Terminal / PTY ---
portable-pty = "0.8"

# --- Misc ---
# zip — used by plugin import/export (template bundles + sideload installs).
zip          = "2"
# (The General MIDI `.sf2`→wav+SFZ converter — and its `rustysynth` dependency —
# moved into `merula-be` with the rest of the merula audio substrate; the shell
# no longer holds any merula code.)
# (The PortableGit 7z download/extract — and its `sevenz-rust2` dependency —
# moved into the `corvus-git-cli` crate, which both the shell and corvus-be use.)
uuid     = { workspace = true }
libc     = "0.2"

# (Object storage — opendal, the `aws-lc-sys` NASM pin, the GCS/OAuth code — is gone
# with `arbor-cloud`: the cloud is the `cloud-storage` plugin and its wasm providers,
# and the shell holds none of it.)

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",                   # BOOL, HANDLE, CloseHandle — base types
  "Win32_System_Threading",             # EcoQoS — SetProcessInformation, SetPriorityClass
  "Win32_System_Diagnostics_ToolHelp",  # EcoQoS — apply throttling to child processes (WebView2 renderers)
  "Win32_Storage_FileSystem",           # FileExplorerModal — GetLogicalDrives (enumerate drive letters)
  "Win32_System_Power",                 # taskbar_icon_refresh — PowerRegisterSuspendResumeNotification
  "Win32_UI_Shell",                     # fs_show_properties — SHObjectProperties (native Properties sheet)
  "Win32_System_Com",                   # fs_show_properties — CoInitializeEx/CoUninitialize for the property sheet's STA
  "Win32_UI_WindowsAndMessaging",       # fs_set_wallpaper — SystemParametersInfoW(SPI_SETDESKWALLPAPER)
] }

# Optional, target-gated openssl-sys. Activated by the `vendored-openssl`
# Cargo feature (see `[features]`). Listed here under `cfg(not(windows))`
# so enabling the feature on Windows is a true no-op — neither the dep nor
# the OpenSSL source compile run, and Windows builds never require Perl.
# When the feature IS active (Linux + macOS release CI), Cargo feature
# unification propagates `vendored` to every other consumer of openssl-sys
# in the dep graph (git2, libssh2-sys, reqwest's native-tls on Linux), so
# OpenSSL is built from source for the right target.
[target.'cfg(not(target_os = "windows"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }
