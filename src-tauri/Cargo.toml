[package]
name        = "arbor"
description = "Arbor — Git GUI Client"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[lib]
name = "arbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ── Cargo features ──────────────────────────────────────────────────────────
# `deep-link-dev` toggles activation of BOTH the deep-link plugin and its
# `single-instance` companion in **debug** builds.  Release builds always
# enable them (see the `cfg(any(not(debug_assertions), feature = ...))`
# guards in lib.rs), independent of this feature — so removing it from
# `default` does NOT affect packaged builds.
#
# Default-OFF for dev: opt in with `cargo tauri dev --features deep-link-dev`.
# Release builds always activate the deep-link plugin (see the
# `cfg(any(not(debug_assertions), feature = ...))` guards in lib.rs).
[features]
default = []
deep-link-dev = []
# The ONNX transcription backends (basic-pitch / Demucs) are owned out-of-process
# by `merula-be` now (its own `onnx` feature, on by default, links onnxruntime in
# the child). The shell no longer depends on the merula facade, so there is no
# `onnx` feature here to forward — the launcher builds/ships merula-be with it.
# Bundle OpenSSL from source instead of linking against the system libssl.
# Activated by the release workflow on Linux + macOS so produced binaries
# don't depend on the runner's libssl version (and so the macOS x86_64 cross
# build on the arm64 runner finds the right OpenSSL for the target).
# Off by default to keep local dev incremental builds fast and avoid the
# Perl/CMake prerequisites the vendored build needs — on Windows this feature
# is a no-op since openssl-sys isn't in the dep graph (native-tls uses
# Schannel, libgit2 uses WinHTTP).
vendored-openssl = ["dep:openssl-sys"]

# NOTE — the [profile.release] section moved to the workspace root
# Cargo.toml (../Cargo.toml) when this crate became a workspace member.
# Cargo only honours profile sections at the workspace root and silently
# ignores them in member crates. The rationale for the chosen settings
# (panic=unwind, strip=debuginfo, debug=1) is preserved in the root file's
# comment block — see "[profile.release]" there.

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
# --- Arbor crates (split out of this crate, see ../Cargo.toml workspace) ---
arbor-process-ext = { path = "../crates/arbor-process-ext" }
arbor-fs          = { path = "../crates/foundation/fs" }
corvus-brp        = { path = "../crates/corvus/brp" }
# Shared provider-descriptor types (the FE-facing connect-form metadata) — still
# used by the git-host connectors below. The issue-tracker crates
# (`corvus-issues`, `corvus-issue-tracker-{api,linear,jira}`) are gone: that whole
# domain (connect / validate / auth-status / image proxy) moved out of process
# into `corvus-be`; the launcher keeps only the OAuth engine + the keyring vault,
# which corvus-be reaches over the reverse channel.
corvus-provider-descriptor = { path = "../crates/corvus/provider-descriptor" }
corvus-git-provider-api = { path = "../crates/corvus/git-provider/api" }
corvus-git-provider-github = { path = "../crates/corvus/git-provider/github" }
corvus-git-provider-gitlab = { path = "../crates/corvus/git-provider/gitlab" }
corvus-pipeline-api = { path = "../crates/corvus/pipeline/api" }
corvus-pipeline-core = { path = "../crates/corvus/pipeline/core" }
corvus-core       = { path = "../crates/corvus/core" }
corvus-plugin     = { path = "../crates/corvus/plugin" }
# Tauri-free system-git detection + PortableGit download (the shell facade in
# `src/git_cli/mod.rs` re-exports this; corvus-be self-detects via the same crate).
corvus-git-cli    = { path = "../crates/corvus/git-cli" }
arbor-ipc         = { path = "../crates/foundation/ipc" }
arbor-shell-common = { path = "../crates/foundation/shell-common" }
arbor-rpc         = { path = "../crates/foundation/rpc" }
arbor-feedback    = { path = "../crates/arbor-feedback" }
arbor-cloud       = { path = "../crates/arbor-cloud" }
arbor-auth        = { path = "../crates/arbor-auth" }
arbor-core        = { path = "../crates/core" }
arbor-plugin-api  = { path = "../crates/plugin/api" }
arbor-plugin-core = { path = "../crates/plugin/core" }
arbor-plugin-marketplace = { path = "../crates/plugin/marketplace" }
arbor-plugin-types = { path = "../crates/plugin/types" }
arbor-scheduler   = { path = "../crates/scheduler" }

# --- Tauri ---
tauri             = { workspace = true }
tauri-plugin-opener       = "2.5.4"
tauri-plugin-notification = "2.3.3"
# Deep-link `arbor://…` URL handling.  The `deep-link` feature of the
# single-instance plugin makes the second invocation forward its argv to
# the running instance (so opening a link never spawns a duplicate).
# Always pulled in — actual activation is `cfg`-gated in lib.rs (release
# always on; debug only with the `deep-link-dev` Cargo feature).
tauri-plugin-deep-link        = "2"
tauri-plugin-single-instance  = { version = "2", features = ["deep-link"] }
# OS-global hotkey (Ctrl+Shift+E) that opens the dedicated File Explorer
# window — see `explorer_window.rs`. Desktop-only plugin; the app is
# desktop-only so no extra cfg gating is needed.
tauri-plugin-global-shortcut  = "2"

# --- Git ---
# The launcher no longer links libgit2: all local-git work (and the `git2` /
# `corvus-git` deps) moved out of process into `corvus-be`. The shell keeps only
# `corvus-git-cli` (above) for the handful of plumbing `git` CLI invocations
# (repo-root / origin-URL lookups). `similar` stays for in-shell text diffing.
similar = { version = "2",    features = ["text", "unicode", "bytes", "inline"] }

# --- Plugin system ---
mlua = { workspace = true }

# --- Async ---
tokio        = { workspace = true }
# Required by `git_provider::GitProvider` trait — async fns in traits via macro.
async-trait  = { workspace = true }

# --- Auth / HTTP ---
keyring = { workspace = true }
reqwest = { workspace = true }

# --- Serialization ---
serde      = { workspace = true }
serde_json = { workspace = true }
# SIMD-accelerated JSON parser. Used ONLY by the json_studio plugin namespace
# (`plugin/api/ns/json_studio.rs`) for parsing multi-MB documents into a lazy
# tree the JSON Studio modal navigates without blocking the UI. Earmarked to
# be removed once the JSON Studio plugin is migrated to the WASM plugin
# runtime — the dep moves into the plugin's own WASM module.
# See: memory/project_json_studio_plugin.md
simd-json       = "0.13"
# RFC 9535 JSONPath engine — powers the JSON Studio query bar (filters,
# slices, multi-select, regex match/search). Same WASM-migration earmark
# as simd-json above.
serde_json_path = "0.7"
# JSONC (JSON with comments) parser with byte-range AST — JSON Studio's
# editable doc model since Phase 3.b. Parses in strict-JSON mode for `.json`
# files; the same AST flips to relaxed mode (comments + trailing commas) in
# Phase 3.d for `.jsonc`. We use it strictly for the AST + byte ranges that
# drive position-preserving splice mutations — pure-data parses still go
# through `simd-json` (read-only views, multi-MB streaming) above.
jsonc-parser = { version = "0.32", features = ["serde"] }
# RON Studio originally pulled in the `ron` crate for parsing, but
# `ron::Value` officially doesn't support enums ("Value does not store
# them" per its own docs) — variant tags are dropped. Since RON's main
# appeal is tagged enums (`element: Dark`, `variant: Action(..)`) we
# ship a small custom AST parser in `src/ron_studio/ast.rs` instead,
# which preserves variant tags. The `ron` crate is therefore NOT a host
# dependency.
# Rust source parser used by RON Studio's "Load schema from .rs" feature
# (`ron_studio/schema.rs`) — walks an entire crate from its Cargo.toml,
# extracts struct/enum definitions, resolves `mod`/`use`/aliases, and
# computes the reachable type closure from a chosen root type. `extra-traits`
# enables `PartialEq`/`Eq`/`Hash` on AST nodes which simplifies cycle
# detection during BFS. No native deps.
syn = { version = "2", features = ["full", "extra-traits", "parsing"] }
# Pretty-printer for `syn` AST → readable Rust source. Used by RON Studio's
# "View implementation" feature so the user can see the actual definition
# of a struct/enum referenced anywhere in their RON file.
prettyplease = "0.2"
quote = "1"
# Structured file edits exposed as `arbor.fs.json_set / yaml_set / toml_set`
# for plugins that need reliable cross-platform config editing
# inside a LuaOp pipeline step (see src/plugin/api.rs + src/pipeline).
# Also used by `yaml_studio` for the JSON projection (tree / JSONPath
# query): multi-doc streams parse via `serde_yaml_ng::Deserializer` and
# project to `serde_json::Value`. Editing / save goes through
# `yaml_edit` below, NOT through this crate — `serde_yaml_ng` would lose
# comments and reformat on round-trip. Maintained fork of the archived
# `serde_yaml` (replaces the unmaintained/unsound `serde_yml` + `libyml`
# stack flagged by GHSA-hhw4-xg65-fp2x / GHSA-gfxp-f68g-8x78).
serde_yaml_ng = "0.10"
# `yaml_edit` — lossless YAML AST built on rowan (same syntax-tree
# engine used by rust-analyzer + `toml_edit`). Used by `yaml_studio`
# (Phase 5.b) as the source-of-truth for the editable Studio modal:
# mutations clone the `Document`, set/insert/remove on the typed
# wrappers, and re-emit through `Display`. Comments, whitespace,
# quote style, anchors, and tags survive the round-trip.
yaml-edit = "0.2"
base64     = { workspace = true }

# --- Config / paths ---
dirs   = { workspace = true }
toml   = "0.8"
# `toml_edit` — lossless TOML AST that preserves comments / whitespace /
# inline-vs-block formatting natively. Used by `toml_studio` (Phase 4)
# for the editable Studio modal. The `toml` crate at 0.8 internally
# uses `toml_edit ~0.22`, so pinning the same major aligns the version
# in `Cargo.lock`.
toml_edit = "0.22"
semver = "1"

# --- File watch ---
notify = "6"

# --- Trash / Recycle Bin ---
# Cross-platform move-to-trash for the built-in file explorer's Delete action
# (Recycle Bin on Windows, Trash on macOS, freedesktop trash on Linux).
# Shift+Delete bypasses this and removes permanently via std::fs.
trash = "5"

# --- Native system icons ---
# Real shell/desktop icon for a file extension, returned as PNG bytes, for the
# built-in file explorer's `fs_icon` command. Windows → shell icons (pulls in
# the full `windows` crate + `image` transitively, Windows-only); macOS →
# NSWorkspace; Linux → GTK icon theme (needs GTK dev libs at build time).
# Folders aren't covered (the crate resolves by file attribute) — the explorer
# keeps its themed folder icon for those.
systemicons = "0.9"

# --- Error handling ---
thiserror = { workspace = true }

# --- Logging ---
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- Terminal / PTY ---
portable-pty = "0.8"

# --- Misc ---
# zip — used by plugin import/export (template bundles + sideload installs).
zip          = "2"
# (The General MIDI `.sf2`→wav+SFZ converter — and its `rustysynth` dependency —
# moved into `merula-be` with the rest of the merula audio substrate; the shell
# no longer holds any merula code.)
# (The PortableGit 7z download/extract — and its `sevenz-rust2` dependency —
# moved into the `corvus-git-cli` crate, which both the shell and corvus-be use.)
uuid     = { workspace = true }
libc     = "0.2"

# --- Cloud storage (cloud-storage plugin) ---
# opendal + the aws-lc-sys NASM-prebuilt pin live in `crates/arbor-cloud` as
# of the Phase A split. The plugin host command layer (`commands/cloud_commands.rs`
# + `plugin/api/ns/cloud.rs`) consumes the cloud crate via `arbor-cloud` above.
# Same WASM-migration earmark applies — when the WASM plugin runtime lands,
# the cloud crate + cloud_commands + ns/cloud.rs all get deleted together.

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",                   # BOOL, HANDLE, CloseHandle — base types
  "Win32_System_Threading",             # EcoQoS — SetProcessInformation, SetPriorityClass
  "Win32_System_Diagnostics_ToolHelp",  # EcoQoS — apply throttling to child processes (WebView2 renderers)
  "Win32_Storage_FileSystem",           # FileExplorerModal — GetLogicalDrives (enumerate drive letters)
  "Win32_System_Power",                 # taskbar_icon_refresh — PowerRegisterSuspendResumeNotification
  "Win32_UI_Shell",                     # fs_show_properties — SHObjectProperties (native Properties sheet)
  "Win32_System_Com",                   # fs_show_properties — CoInitializeEx/CoUninitialize for the property sheet's STA
  "Win32_UI_WindowsAndMessaging",       # fs_set_wallpaper — SystemParametersInfoW(SPI_SETDESKWALLPAPER)
] }

# Optional, target-gated openssl-sys. Activated by the `vendored-openssl`
# Cargo feature (see `[features]`). Listed here under `cfg(not(windows))`
# so enabling the feature on Windows is a true no-op — neither the dep nor
# the OpenSSL source compile run, and Windows builds never require Perl.
# When the feature IS active (Linux + macOS release CI), Cargo feature
# unification propagates `vendored` to every other consumer of openssl-sys
# in the dep graph (git2, libssh2-sys, reqwest's native-tls on Linux), so
# OpenSSL is built from source for the right target.
[target.'cfg(not(target_os = "windows"))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }
