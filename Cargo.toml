[workspace]
resolver = "2"
# Explicit members list (not a `crates/*` glob): the rest of the directories
# under `crates/` are scaffolded stubs (see docs/crate-refactor.md) without a
# `src/lib.rs` yet, and Cargo would refuse to compile the workspace if it
# picked them up. Each future PR in the refactor activates one crate by
# appending its path here and adding the crate's `src/lib.rs`.
members = [
    "src-tauri",
    "crates/arbor-auth",
    "crates/arbor-cloud",
    "crates/arbor-process-ext",
    "crates/arbor-feedback",
    "crates/core",
    "crates/foundation/be",
    "crates/foundation/fs",
    "crates/foundation/ipc",
    "crates/foundation/shell-common",
    "crates/foundation/rpc",
    "crates/foundation/rpc-macros",
    "crates/corvus/core",
    "crates/corvus/plugin",
    "crates/corvus/plugin-ns",
    "crates/corvus/be",
    "crates/corvus/git",
    "crates/corvus/git-cli",
    "crates/corvus/brp",
    "crates/corvus/issue-tracker/api",
    "crates/corvus/issue-tracker/linear",
    "crates/corvus/issue-tracker/jira",
    "crates/corvus/issues",
    "crates/corvus/provider-descriptor",
    "crates/corvus/git-provider/api",
    "crates/corvus/git-provider/github",
    "crates/corvus/git-provider/gitlab",
    "crates/corvus/pipeline/api",
    "crates/corvus/pipeline/core",
    "crates/plugin/api",
    "crates/plugin/core",
    "crates/plugin/marketplace",
    "crates/plugin/rpc",
    "crates/plugin/types",
    "crates/scheduler",
    "crates/merula/merula-pattern",
    "crates/merula/merula-lang",
    "crates/merula/merula-audio",
    "crates/merula/merula-engine",
    "crates/merula/merula-import",
    "crates/merula/merula-transcribe",
    "crates/merula/merula",
    "crates/merula/core",
    "crates/merula/be",
    "crates/sitta/core",
    "crates/sitta/be",
]

# ── Shared package metadata ─────────────────────────────────────────────────
# Inherit with `version.workspace = true` etc. in member crates.
[workspace.package]
version      = "0.3.0"
edition      = "2021"
rust-version = "1.80"
license      = "GPL-3.0-only"
authors      = ["Nightprint Studio"]

# ── Shared dependencies ─────────────────────────────────────────────────────
# Member crates pin with `serde.workspace = true` to avoid version drift.
# Only deps used by 2+ crates (or that arbor-cloud needs) are listed here for
# now. The rest stays inline in src-tauri/Cargo.toml until the next split.
[workspace.dependencies]
# Core
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
tracing    = "0.1"
tokio      = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Minimal `block_on` executor — lets sync Tauri command call sites drive the
# async `HookDispatcher` without a Tokio runtime context (the listener bodies
# are synchronous Lua work, so this never blocks a worker).
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
async-trait  = "0.1"

# Plugin runtime (Lua). ONE pin shared by every plugin-host crate (arbor-plugin-
# core, corvus-plugin, corvus-plugin-ns, the product BEs sitta/corvus, the shell)
# so Cargo builds a SINGLE mlua artifact — the installers' `&Lua` must be the very
# same type the host's `register_lua_api` builds. lua54 + vendored (no system Lua);
# `serialize` = serde<->Lua; `send` because plugin code may run on async tasks.
mlua = { version = "0.11.6", features = ["lua54", "vendored", "serialize", "send"] }

# HTTP / auth / crypto
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64  = "0.22"
sha2    = "0.10"
# Wipe in-memory secrets on drop (credential broker cache, round-2 Model D).
# Defined here, used from M1 (arbor-shell-common); see docs/migration-roadmap.md.
zeroize = { version = "1", features = ["derive"] }

# Misc
uuid   = { version = "1", features = ["v4"] }
dirs   = "6.0.0"
regex  = "1"
# MIDI (SMF) read/write — pure-Rust, zero-dep. Used by the merula import/transcribe
# crates: parse an external/transient `.mid` and write `.mid` on disk.
midly  = "0.5"

# Tauri (member crates that need AppHandle / Manager pull this in)
tauri = { version = "2.11.0", features = ["tray-icon", "image-png", "image-ico", "protocol-asset"] }

# Cloud-only — pinned here so the eventual WASM-migration only edits one place
opendal = { version = "0.56", default-features = false, features = [
  "services-gcs",
  "services-s3",
  "services-azblob",
  "reqwest-rustls-tls",
] }
aws-lc-sys = { version = "0.41", features = ["prebuilt-nasm"] }

# ── Release profile ─────────────────────────────────────────────────────────
# Moved from src-tauri/Cargo.toml: profile sections must live at workspace root.
# Tuning rationale unchanged — see comment block in the original location.
[profile.release]
opt-level     = "s"
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"
panic         = "unwind"
debug         = 1
