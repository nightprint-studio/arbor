[workspace]
resolver = "2"
# Explicit members list (not a `crates/*` glob): the rest of the directories
# under `crates/` are scaffolded stubs (see docs/crate-refactor.md) without a
# `src/lib.rs` yet, and Cargo would refuse to compile the workspace if it
# picked them up. Each future PR in the refactor activates one crate by
# appending its path here and adding the crate's `src/lib.rs`.
members = [
    "src-tauri",
    "crates/platform/auth",
    "crates/platform/process-ext",
    "crates/platform/feedback",
    "crates/foundation/core",
    "crates/foundation/be",
    "crates/foundation/history",
    "crates/foundation/fs",
    # The one HTTP server in the workspace. Listening (MCP, and the OAuth redirect
    # catcher once `arbor-auth` migrates onto it) — never outbound, that is `reqwest`.
    "crates/foundation/http",
    "crates/foundation/ipc",
    "crates/foundation/shell-common",
    "crates/foundation/rpc",
    "crates/foundation/rpc-macros",
    "crates/foundation/sql-abbrev",
    "crates/foundation/syntax",
    "crates/foundation/logscan",
    "crates/products/bennu/plugin",
    "crates/products/bennu/wgsl",
    "crates/products/corvus/core",
    "crates/products/corvus/plugin",
    "crates/products/corvus/plugin-ns",
    "crates/products/corvus/be",
    "crates/products/corvus/git",
    "crates/products/corvus/git-cli",
    "crates/wasm/brp",
    "crates/wasm/studio/types",
    "crates/wasm/studio/core",
    "crates/wasm/studio/toml",
    "crates/wasm/studio/yaml",
    "crates/wasm/studio/json",
    "crates/wasm/studio/ron",
    "crates/wasm/studio/properties",
    "crates/wasm/studio/api",
    "crates/products/corvus/issue-tracker/api",
    "crates/products/corvus/issue-tracker/linear",
    "crates/products/corvus/issue-tracker/jira",
    "crates/products/corvus/issues",
    "crates/products/corvus/provider-descriptor",
    "crates/products/corvus/git-provider/api",
    "crates/products/corvus/git-provider/github",
    "crates/products/corvus/git-provider/gitlab",
    "crates/products/corvus/pipeline/api",
    "crates/products/corvus/pipeline/core",
    "crates/platform/plugin/api",
    "crates/platform/plugin/core",
    "crates/platform/plugin/marketplace",
    # The platform's own Lua namespaces (`arbor.job`): product-agnostic by construction —
    # every op forwards to the shell — so any backend with a reverse channel installs them
    # (Corvus and Bennu both do).
    "crates/platform/plugin/ns",
    "crates/platform/plugin/rpc",
    "crates/platform/plugin/types",
    # The wasm extension host. Separate from `plugin/core` (the Lua host) because the two
    # share nothing but the manifest: a Lua plugin CALLS Arbor's API, an extension IMPLEMENTS
    # an interface Arbor calls into, and merging them would put a multi-megabyte runtime
    # dependency in front of every plugin that will never need one.
    "crates/platform/plugin/wasm",
    # The AI tool surface: MCP protocol only. What the tools DO stays in the shell,
    # which is also where the user can see and gate it.
    "crates/platform/mcp",
    "crates/platform/scheduler",
    "crates/products/merula/merula-pattern",
    "crates/products/merula/merula-lang",
    "crates/products/merula/merula-audio",
    "crates/products/merula/merula-engine",
    "crates/products/merula/merula-import",
    "crates/products/merula/merula-transcribe",
    "crates/products/merula/merula",
    "crates/products/merula/core",
    "crates/products/merula/be",
    "crates/products/sitta/core",
    "crates/products/sitta/be",
    "crates/products/tyto/core",
    "crates/products/tyto/be",
    "crates/products/bennu/proto",
    "crates/products/bennu/core",
    "crates/products/bennu/project",
    "crates/products/bennu/classpath",
    "crates/products/bennu/index",
    "crates/products/bennu/java",
    "crates/products/bennu/intentions",
    "crates/products/bennu/jsp-grammar",
    "crates/products/bennu/jsp",
    "crates/products/bennu/i18n",
    # The fulcrum engine's conventions, one crate per subsystem. Each registers itself with the
    # framework-extension seam under a namespaced id, so a sibling is a new crate plus one line.
    "crates/products/bennu/fulcrum/i18n",
    "crates/products/bennu/web",
    "crates/products/bennu/spel",
    "crates/products/bennu/facts",
    "crates/products/bennu/complete",
    "crates/products/bennu/npm",
    "crates/products/bennu/ext",
    "crates/products/bennu/spring",
    "crates/products/bennu/jpa",
    # Bevy ECS, read from the source shape: the fourth framework extension, and the second that
    # is not Java's.
    "crates/products/bennu/bevy",
    "crates/products/bennu/dtd",
    "crates/products/bennu/xsd",
    "crates/products/bennu/xml",
    "crates/products/bennu/deps",
    "crates/products/bennu/maven",
    "crates/products/bennu/refactor",
    # What a Cargo workspace IS, read off its manifests: the crate graph, the manifest
    # schema behind Cargo.toml validation + completion, and the cargo command catalogue.
    "crates/products/bennu/cargo",
    # TOML read with positions — every table and key with the byte offsets of its value. Its own
    # crate because it owns no schema: `bennu-cargo` reads a manifest with it, the fulcrum i18n
    # extension reads a message bundle.
    "crates/products/bennu/toml",
    "crates/products/bennu/query",
    # The `Content-Length` base protocol, shared by the LSP and DAP clients below. Dependency-free
    # by construction: it is `std::io` and a header parser.
    "crates/products/bennu/framed",
    # The LSP client — the impl of bennu-intel's predisposed slot. A leaf: serde plus
    # two workspace-internal crates, so it can be split out unchanged.
    "crates/products/bennu/lsp",
    # The DAP client — the debugger's transport, and the Rust half of what JDWP is for Java. Same
    # shape as `lsp`: hand-rolled protocol, serde, and the shared frame reader.
    "crates/products/bennu/dap",
    "crates/products/bennu/check",
    # Naming conventions as an opt-in feature pack: a leaf that turns a grammar into "this
    # declaration breaks the convention the project declared, and here is the name that would not".
    "crates/products/bennu/naming",
    "crates/products/bennu/test",
    "crates/products/bennu/jdwp",
    "crates/products/bennu/ssr",
    "crates/products/bennu/intel",
    "crates/products/bennu/be",
    "crates/products/picus/types",
    "crates/products/picus/ast",
    "crates/products/picus/emit",
    "crates/products/picus/parse",
    "crates/products/picus/project",
    "crates/products/picus/inventory",
    "crates/products/picus/analyze",
    "crates/products/picus/rewrite",
    "crates/products/picus/core",
    "crates/products/picus/db-provider/api",
    "crates/products/picus/db-provider/postgres",
    "crates/products/picus/lineage",
    "crates/products/picus/diff",
    "crates/products/picus/be",
    # Garrulus (notes): the same layering as Picus — a leaf model, a parser over
    # it, then the domain crates. Order matters only for readability; Cargo
    # resolves the path deps itself.
    "crates/products/garrulus/ast",
    "crates/products/garrulus/parse",
    "crates/products/garrulus/vault",
    "crates/products/garrulus/index",
    "crates/products/garrulus/sync",
    "crates/products/garrulus/core",
    "crates/products/garrulus/be",
]

# ── Shared package metadata ─────────────────────────────────────────────────
# Inherit with `version.workspace = true` etc. in member crates.
[workspace.package]
version      = "0.3.0"
edition      = "2021"
rust-version = "1.80"
license      = "GPL-3.0-only"
authors      = ["Nightprint Studio"]

# ── Shared dependencies ─────────────────────────────────────────────────────
# Member crates pin with `serde.workspace = true` to avoid version drift.
# Only deps used by 2+ crates (or that arbor-cloud needs) are listed here for
# now. The rest stays inline in src-tauri/Cargo.toml until the next split.
[workspace.dependencies]
# Core
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
tracing    = "0.1"
tokio      = { version = "1", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Minimal `block_on` executor — lets sync Tauri command call sites drive the
# async `HookDispatcher` without a Tokio runtime context (the listener bodies
# are synchronous Lua work, so this never blocks a worker).
futures-executor = { version = "0.3", default-features = false, features = ["std"] }
async-trait  = "0.1"

# Plugin runtime (Lua). ONE pin shared by every plugin-host crate (arbor-plugin-
# core, corvus-plugin, corvus-plugin-ns, the product BEs sitta/corvus, the shell)
# so Cargo builds a SINGLE mlua artifact — the installers' `&Lua` must be the very
# same type the host's `register_lua_api` builds. lua54 + vendored (no system Lua);
# `serialize` = serde<->Lua; `send` because plugin code may run on async tasks.
mlua = { version = "0.11.6", features = ["lua54", "vendored", "serialize", "send"] }

# HTTP / auth / crypto
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64  = "0.22"
sha2    = "0.10"
# Wipe in-memory secrets on drop (credential broker cache, round-2 Model D).
# Defined here, used from M1 (arbor-shell-common); see docs/migration-roadmap.md.
zeroize = { version = "1", features = ["derive"] }

# Misc
uuid   = { version = "1", features = ["v4"] }
# JSON Schema generation for the MCP tool surface. ONE pin shared by arbor-rpc (which
# re-exports it) and by every crate that derives `JsonSchema` on a handler's args struct
# — a derive macro needs its own crate name in scope, so those depend on it directly.
schemars = "1.2"
dirs   = "6.0.0"
regex  = "1"
# gitignore semantics (nested `.gitignore` stacks, negations, `.git/info/exclude`, the
# user's global excludes). Used by bennu-project's file tree to MARK ignored entries —
# the walk itself stays ours, because the tree shows what git ignores rather than
# hiding it.
ignore = "0.4"
# MIDI (SMF) read/write — pure-Rust, zero-dep. Used by the merula import/transcribe
# crates: parse an external/transient `.mid` and write `.mid` on disk.
midly  = "0.5"
# Text diffing. ONE pin shared by the studio value-differ, the shell's git diff and
# arbor-history's revision diff — three places that must agree on what "changed"
# means, or the same two files read differently depending on which panel is open.
similar = { version = "2", features = ["text", "unicode", "bytes", "inline"] }

# Tauri (member crates that need AppHandle / Manager pull this in)
tauri = { version = "2.11.0", features = ["tray-icon", "image-png", "image-ico", "protocol-asset"] }

# ── Release profile ─────────────────────────────────────────────────────────
# Moved from src-tauri/Cargo.toml: profile sections must live at workspace root.
# Tuning rationale unchanged — see comment block in the original location.
[profile.release]
opt-level     = "s"
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"
panic         = "unwind"
debug         = 1
