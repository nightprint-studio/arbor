<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Bennu · option 7 — "B |"
    The initial, followed by the caret that blinks at the end of a line — the vertical one, as
    a text field draws it.
    The B is constructed, not drawn: a stem, and two half-circle bowls of exact radius, the
    lower one larger than the upper — which is what makes a B look right rather than
    top-heavy. Everything is a stroke of one width, so it holds together at any size.

    The cursor is the horizontal one, restored. The vertical caret was the honest answer to
    "the thing that blinks in a text field", and it did not work here for a reason that only
    shows once you look at it: a vertical bar beside a letter built out of vertical stems
    reads as another stem. It joined the B instead of following it. A horizontal bar on the
    baseline has no counterpart in the letterform, so it can only be the cursor — and it is
    what a terminal blinks anyway.

    Nothing here needs a font, and nothing here is a bird — the fire palette is carrying that
    on its own.
  -->
  <defs>
    <linearGradient id="bn7-bg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#40161a"/><stop offset="55%" stop-color="#2a0d12"/><stop offset="100%" stop-color="#170608"/>
    </linearGradient>
    <linearGradient id="bn7-w1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e03131"/><stop offset="100%" stop-color="#ff9d5c"/></linearGradient>
    <linearGradient id="bn7-w2" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd43b"/><stop offset="100%" stop-color="#ff7a18"/></linearGradient>
    <linearGradient id="bn7-w3" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#c92a2a"/><stop offset="100%" stop-color="#ff922b"/></linearGradient>
    <linearGradient id="bn7-w4" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#ff7a18"/><stop offset="100%" stop-color="#ffe066"/></linearGradient>
    <linearGradient id="bn7-b" x1="160" y1="380" x2="300" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c92a2a"/><stop offset="45%" stop-color="#ff7a18"/><stop offset="100%" stop-color="#ffe066"/>
    </linearGradient>
    <linearGradient id="bn7-caret" x1="300" y1="0" x2="412" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff922b"/><stop offset="100%" stop-color="#fff3c4"/>
    </linearGradient>
    <filter id="bn7-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <clipPath id="bn7-card"><rect x="0" y="0" width="512" height="512" rx="112" ry="112"/></clipPath>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bn7-bg)"/>
  <g clip-path="url(#bn7-card)">
    <polygon points="0,0 260,0 0,260" fill="url(#bn7-w1)"/>
    <polygon points="512,0 512,260 252,0" fill="url(#bn7-w2)"/>
    <polygon points="0,512 0,252 260,512" fill="url(#bn7-w3)"/>
    <polygon points="512,512 252,512 512,252" fill="url(#bn7-w4)"/>
    <rect x="68" y="68" width="376" height="376" rx="56" ry="56" fill="#1c0a0e"/>
    <rect x="68" y="68" width="376" height="80" rx="56" ry="56" fill="#ffffff" fill-opacity="0.04"/>
  </g>

  <!--
    B. Stem from cap-height (150) to baseline (372); upper bowl r=50 (150→250), lower bowl
    r=61 (250→372). Both bowls are true semicircles, so they are exactly as round as each
    other — the thing the eye checks first on a B.
  -->
  <g fill="none" stroke="url(#bn7-b)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"
     filter="url(#bn7-glow)">
    <path d="M 160 150 V 372"/>
    <path d="M 160 150 H 206 A 50 50 0 0 1 206 250 H 160"/>
    <path d="M 160 250 H 214 A 61 61 0 0 1 214 372 H 160"/>
  </g>

  <!-- The cursor: one character wide, sitting ON the baseline the B stands on (372), with
       only a slight rounding — a pill would read as a dash, and a block reads as a cursor. -->
  <rect x="300" y="344" width="112" height="28" rx="7" fill="url(#bn7-caret)" filter="url(#bn7-glow)"/>
</svg>
