<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Merula · option 4 — "M steps"   (option 3, with the lit steps spelling the initial)
    Same sequencer, different pattern: the two stems are full columns, the shoulders drop one
    step each and the vee meets in the middle — an M laid out on a 5×5 grid with no cell to
    spare. It is the one letter that a step grid draws better than a pen would, because an M
    is already four straight runs and a grid has nothing else to offer.
    The unlit steps stay very faint: a sequencer's off steps are context, and here they are
    also the counterform the letter is read against.
  -->
  <defs>
    <linearGradient id="mr4-bg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a1f4a"/><stop offset="55%" stop-color="#251233"/><stop offset="100%" stop-color="#14091d"/>
    </linearGradient>
    <linearGradient id="mr4-w1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff8a1f"/><stop offset="100%" stop-color="#ffd166"/></linearGradient>
    <linearGradient id="mr4-w2" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffb347"/><stop offset="100%" stop-color="#f2600c"/></linearGradient>
    <linearGradient id="mr4-w3" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#7b3fa0"/><stop offset="100%" stop-color="#c77dff"/></linearGradient>
    <linearGradient id="mr4-w4" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#9d4edd"/><stop offset="100%" stop-color="#e0aaff"/></linearGradient>
    <linearGradient id="mr4-lit" x1="120" y1="406" x2="406" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f2600c"/><stop offset="50%" stop-color="#ff8a1f"/><stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="mr4-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <clipPath id="mr4-card"><rect x="0" y="0" width="512" height="512" rx="112" ry="112"/></clipPath>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#mr4-bg)"/>
  <g clip-path="url(#mr4-card)">
    <polygon points="0,0 260,0 0,260" fill="url(#mr4-w1)"/>
    <polygon points="512,0 512,260 252,0" fill="url(#mr4-w2)"/>
    <polygon points="0,512 0,252 260,512" fill="url(#mr4-w3)"/>
    <polygon points="512,512 252,512 512,252" fill="url(#mr4-w4)"/>
    <rect x="68" y="68" width="376" height="376" rx="56" ry="56" fill="#170c22"/>
    <rect x="68" y="68" width="376" height="80" rx="56" ry="56" fill="#ffffff" fill-opacity="0.04"/>
  </g>

  <!-- The 5×5 grid, unlit. Columns at x = 120 + 60n, rows at y = 120 + 60n, cell 46. -->
  <g fill="#ffffff" fill-opacity="0.07">
    <rect x="120" y="120" width="46" height="46" rx="12"/><rect x="180" y="120" width="46" height="46" rx="12"/>
    <rect x="240" y="120" width="46" height="46" rx="12"/><rect x="300" y="120" width="46" height="46" rx="12"/>
    <rect x="360" y="120" width="46" height="46" rx="12"/>
    <rect x="120" y="180" width="46" height="46" rx="12"/><rect x="180" y="180" width="46" height="46" rx="12"/>
    <rect x="240" y="180" width="46" height="46" rx="12"/><rect x="300" y="180" width="46" height="46" rx="12"/>
    <rect x="360" y="180" width="46" height="46" rx="12"/>
    <rect x="120" y="240" width="46" height="46" rx="12"/><rect x="180" y="240" width="46" height="46" rx="12"/>
    <rect x="240" y="240" width="46" height="46" rx="12"/><rect x="300" y="240" width="46" height="46" rx="12"/>
    <rect x="360" y="240" width="46" height="46" rx="12"/>
    <rect x="120" y="300" width="46" height="46" rx="12"/><rect x="180" y="300" width="46" height="46" rx="12"/>
    <rect x="240" y="300" width="46" height="46" rx="12"/><rect x="300" y="300" width="46" height="46" rx="12"/>
    <rect x="360" y="300" width="46" height="46" rx="12"/>
    <rect x="120" y="360" width="46" height="46" rx="12"/><rect x="180" y="360" width="46" height="46" rx="12"/>
    <rect x="240" y="360" width="46" height="46" rx="12"/><rect x="300" y="360" width="46" height="46" rx="12"/>
    <rect x="360" y="360" width="46" height="46" rx="12"/>
  </g>

  <!--
    The M:
      X . . . X
      X X . X X
      X . X . X
      X . . . X
      X . . . X
  -->
  <g fill="url(#mr4-lit)" filter="url(#mr4-glow)">
    <!-- left stem -->
    <rect x="120" y="120" width="46" height="46" rx="12"/>
    <rect x="120" y="180" width="46" height="46" rx="12"/>
    <rect x="120" y="240" width="46" height="46" rx="12"/>
    <rect x="120" y="300" width="46" height="46" rx="12"/>
    <rect x="120" y="360" width="46" height="46" rx="12"/>
    <!-- right stem -->
    <rect x="360" y="120" width="46" height="46" rx="12"/>
    <rect x="360" y="180" width="46" height="46" rx="12"/>
    <rect x="360" y="240" width="46" height="46" rx="12"/>
    <rect x="360" y="300" width="46" height="46" rx="12"/>
    <rect x="360" y="360" width="46" height="46" rx="12"/>
    <!-- the vee -->
    <rect x="180" y="180" width="46" height="46" rx="12"/>
    <rect x="300" y="180" width="46" height="46" rx="12"/>
    <rect x="240" y="240" width="46" height="46" rx="12"/>
  </g>

  <!-- The playhead, on the column sounding now. -->
  <rect x="112" y="112" width="62" height="302" rx="18" fill="none" stroke="#ffd166" stroke-width="5" opacity="0.45"/>
</svg>
