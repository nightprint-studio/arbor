<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Tyto · option 4 — "T with eyes"   (the initial, under the new rule)
    You did not ask for this one, but the rule you set is general, so here is Tyto's.
    The T is doing two jobs: it is the letter, and its crossbar is the brow an owl's two eyes
    sit under, with the stem falling between them where the face narrows to a point. That
    dual reading is the only reason a bare letter is worth drawing here — otherwise the owl
    would just have been deleted.
    One eye is the record light. It is the sole asymmetry in the mark, so it is the thing you
    look at first, which is correct: recording is the verb.
  -->
  <defs>
    <linearGradient id="ty4-bg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a2a12"/><stop offset="55%" stop-color="#241a0c"/><stop offset="100%" stop-color="#140e06"/>
    </linearGradient>
    <linearGradient id="ty4-w1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c98c2a"/><stop offset="100%" stop-color="#ffd8a8"/></linearGradient>
    <linearGradient id="ty4-w2" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe8c4"/><stop offset="100%" stop-color="#e0a33c"/></linearGradient>
    <linearGradient id="ty4-w3" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#8a5a1e"/><stop offset="100%" stop-color="#e0a33c"/></linearGradient>
    <linearGradient id="ty4-w4" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#c92a2a"/><stop offset="100%" stop-color="#ff8787"/></linearGradient>
    <linearGradient id="ty4-t" x1="150" y1="140" x2="360" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff6e6"/><stop offset="55%" stop-color="#f0d9b5"/><stop offset="100%" stop-color="#c98c2a"/>
    </linearGradient>
    <radialGradient id="ty4-rec" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#ff8787"/><stop offset="55%" stop-color="#e03131"/><stop offset="100%" stop-color="#a51111"/>
    </radialGradient>
    <filter id="ty4-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ty4-rec-glow" x="-110%" y="-110%" width="320%" height="320%">
      <feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <clipPath id="ty4-card"><rect x="0" y="0" width="512" height="512" rx="112" ry="112"/></clipPath>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#ty4-bg)"/>
  <g clip-path="url(#ty4-card)">
    <polygon points="0,0 260,0 0,260" fill="url(#ty4-w1)"/>
    <polygon points="512,0 512,260 252,0" fill="url(#ty4-w2)"/>
    <polygon points="0,512 0,252 260,512" fill="url(#ty4-w3)"/>
    <polygon points="512,512 252,512 512,252" fill="url(#ty4-w4)"/>
    <rect x="68" y="68" width="376" height="376" rx="56" ry="56" fill="#170f07"/>
    <rect x="68" y="68" width="376" height="80" rx="56" ry="56" fill="#ffffff" fill-opacity="0.04"/>
  </g>

  <!-- The heart-shaped facial disc, faint: it is what makes the crossbar read as a brow. -->
  <path d="M 256 118 C 178 118, 126 168, 126 234
           C 126 320, 188 398, 256 418
           C 324 398, 386 320, 386 234
           C 386 168, 334 118, 256 118 Z"
        fill="#fff6e6" opacity="0.1"/>

  <!-- T. The crossbar is heavy enough to hold the eyes inside it. -->
  <g stroke="url(#ty4-t)" stroke-linecap="round" fill="none" filter="url(#ty4-glow)">
    <path d="M 152 172 H 360" stroke-width="66"/>
    <path d="M 256 196 V 392" stroke-width="50"/>
  </g>

  <!-- The eyes, punched into the crossbar. -->
  <circle cx="200" cy="172" r="23" fill="#170f07"/>
  <circle cx="312" cy="172" r="23" fill="#170f07"/>
  <circle cx="312" cy="172" r="9" fill="#f0d9b5" opacity="0.55"/>
  <g filter="url(#ty4-rec-glow)">
    <circle cx="200" cy="172" r="15" fill="url(#ty4-rec)"/>
  </g>
</svg>
