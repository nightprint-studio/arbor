<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Hirundo — the swallow's H: a request going across and its response coming back, two crossbars
    with opposite arrowheads. Rose on the suite's card, border in the program's colour.
  -->
  <defs>
    <linearGradient id="hi-bg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#3d1028"/><stop offset="55%" stop-color="#2b0b1d"/><stop offset="100%" stop-color="#190510"/></linearGradient>
    <linearGradient id="hi-w1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a61e4d"/><stop offset="100%" stop-color="#ff8fb8"/></linearGradient>
    <linearGradient id="hi-w2" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffc9de"/><stop offset="100%" stop-color="#f06595"/></linearGradient>
    <linearGradient id="hi-w3" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#862e9c"/><stop offset="100%" stop-color="#e599f7"/></linearGradient>
    <linearGradient id="hi-w4" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#d6336c"/><stop offset="100%" stop-color="#ffe3ee"/></linearGradient>
    <linearGradient id="hi-fg" x1="150" y1="400" x2="370" y2="110" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#c2255c"/><stop offset="55%" stop-color="#f06595"/><stop offset="100%" stop-color="#ffc2d9"/></linearGradient>
    <filter id="hi-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="hi-card"><rect x="0" y="0" width="512" height="512" rx="112" ry="112"/></clipPath>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#hi-bg)"/>
  <g clip-path="url(#hi-card)">
    <polygon points="0,0 260,0 0,260" fill="url(#hi-w1)"/>
    <polygon points="512,0 512,260 252,0" fill="url(#hi-w2)"/>
    <polygon points="0,512 0,252 260,512" fill="url(#hi-w3)"/>
    <polygon points="512,512 252,512 512,252" fill="url(#hi-w4)"/>
    <rect x="68" y="68" width="376" height="376" rx="56" ry="56" fill="#1d0814"/>
    <rect x="68" y="68" width="376" height="80" rx="56" ry="56" fill="#ffffff" fill-opacity="0.04"/>
  </g>
  <g fill="none" stroke="url(#hi-fg)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#hi-glow)"><path d="M160 140V372"/><path d="M352 140V372"/><path d="M160 216H318"/><path d="M286 184L318 216 286 248"/><path d="M352 300H194"/><path d="M226 268L194 300 226 332"/></g>
</svg>
