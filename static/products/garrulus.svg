<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Garrulus · option 4 — "G in the note"   (option 2, with the initial as the note's content)
    The card and the barred lines stay; the G takes the middle, where a note's substance goes.
    Lines above it and lines below it, so the letter reads as something written on the page
    rather than as a stamp across it.
    The G is constructed: one arc of 330° about a single centre, closing into a horizontal bar
    at mid-height. That bar is what separates a G from a C, and giving it exactly half the
    letter's width is what stops it looking like an afterthought.
  -->
  <defs>
    <linearGradient id="ga4-bg" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a2536"/><stop offset="55%" stop-color="#241722"/><stop offset="100%" stop-color="#140c13"/>
    </linearGradient>
    <linearGradient id="ga4-w1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c98a86"/><stop offset="100%" stop-color="#f3ceb9"/></linearGradient>
    <linearGradient id="ga4-w2" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0b6a0"/><stop offset="100%" stop-color="#b06a63"/></linearGradient>
    <linearGradient id="ga4-w3" x1="1" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#1f6fd0"/><stop offset="100%" stop-color="#7cc4ff"/></linearGradient>
    <linearGradient id="ga4-w4" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#3b8ee0"/><stop offset="100%" stop-color="#bfe3ff"/></linearGradient>
    <linearGradient id="ga4-page" x1="130" y1="120" x2="382" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f6dccb"/><stop offset="100%" stop-color="#c79a92"/>
    </linearGradient>
    <linearGradient id="ga4-g" x1="190" y1="350" x2="310" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f6fd0"/><stop offset="55%" stop-color="#3b8ee0"/><stop offset="100%" stop-color="#bfe3ff"/>
    </linearGradient>
    <filter id="ga4-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <clipPath id="ga4-card"><rect x="0" y="0" width="512" height="512" rx="112" ry="112"/></clipPath>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#ga4-bg)"/>
  <g clip-path="url(#ga4-card)">
    <polygon points="0,0 260,0 0,260" fill="url(#ga4-w1)"/>
    <polygon points="512,0 512,260 252,0" fill="url(#ga4-w2)"/>
    <polygon points="0,512 0,252 260,512" fill="url(#ga4-w3)"/>
    <polygon points="512,512 252,512 512,252" fill="url(#ga4-w4)"/>
    <rect x="68" y="68" width="376" height="376" rx="56" ry="56" fill="#180f16"/>
    <rect x="68" y="68" width="376" height="80" rx="56" ry="56" fill="#ffffff" fill-opacity="0.04"/>
  </g>

  <!-- Two pages behind, so the mark is a vault and not one note. -->
  <rect x="152" y="104" width="216" height="292" rx="34" fill="#c79a92" opacity="0.3"/>
  <rect x="140" y="118" width="228" height="292" rx="34" fill="#c79a92" opacity="0.5"/>
  <rect x="126" y="132" width="240" height="292" rx="34" fill="url(#ga4-page)" filter="url(#ga4-glow)"/>

  <!-- The jay's barred lines, above and below the letter. Blue alternating with dark, as the
       bird's wing patch does. -->
  <g>
    <rect x="160" y="162" width="172" height="16" rx="8" fill="#1f6fd0"/>
    <rect x="160" y="186" width="172" height="16" rx="8" fill="#180f16" opacity="0.65"/>
    <rect x="160" y="370" width="172" height="16" rx="8" fill="#180f16" opacity="0.65"/>
    <rect x="160" y="394" width="104" height="16" rx="8" fill="#7cc4ff"/>
  </g>

  <!--
    G. One arc about (246,286) r=54, entered at its 1 o'clock and swept 330° the long way
    round to its 3 o'clock, then straight in to the middle.
  -->
  <g filter="url(#ga4-glow)">
    <path d="M 293 259 A 54 54 0 1 0 300 286 H 258"
          fill="none" stroke="url(#ga4-g)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
